    body { font-family: 'DM Sans', sans-serif; background: #FFF7ED; margin: 0; }
    .cui-card-title, .cui-page-title { font-family: 'Sora', sans-serif; }

    /* Announcement item */
    .ann-item {
      background: #fff; border: 1px solid #FED7AA; border-radius: 12px;
      padding: 1.1rem 1.25rem; margin-bottom: .7rem;
      display: flex; gap: 1rem; align-items: flex-start;
      transition: box-shadow .15s;
    }
    .ann-item:hover  { box-shadow: 0 4px 12px rgba(234,88,12,.1); }
    .ann-item.pinned { border-color: #EA580C; background: #FFF7ED; }
    .ann-item-body    { flex: 1; min-width: 0; }
    .ann-item-title   { font-family: Sora,sans-serif; font-weight:700; color:#1A0A00; font-size:.95rem; }
    .ann-item-text    { font-size:.84rem; color:#6B3A1F; margin-top:.25rem; line-height:1.6; }
    .ann-item-meta    { font-size:.74rem; color:#9A6647; margin-top:.4rem; }
    .ann-item-actions { display:flex; flex-direction:column; gap:.4rem; flex-shrink:0; }

    /* Pending approval card — stacks vertically on small screens */
    .approval-card {
      background: #fff; border: 1px solid #FED7AA; border-radius: 12px;
      padding: 1.1rem 1.25rem; margin-bottom: .75rem;
      display: flex; align-items: center; gap: 1rem;
      flex-wrap: wrap;                        /* allows wrapping on narrow screens */
      transition: box-shadow .15s;
    }
    .approval-card:hover { box-shadow: 0 4px 12px rgba(234,88,12,.1); }
    .approval-info  { flex: 1; min-width: 180px; }  /* won't shrink below 180px */
    .approval-name  { font-family: Sora,sans-serif; font-weight:700; color:#1A0A00; font-size:.95rem; }
    .approval-meta  { font-size:.78rem; color:#9A6647; margin-top:.2rem; }
    .approval-badge { flex-shrink: 0; }
    .approval-actions {
      display: flex; gap: .5rem; flex-shrink: 0;
      flex-wrap: wrap;                        /* buttons themselves also wrap if needed */
    }
    /* On very narrow screens hide the badge (redundant with card context) */
    @media (max-width: 480px) {
      .approval-badge { display: none; }
      .approval-actions { width: 100%; justify-content: flex-end; }
      .approval-card { align-items: flex-start; }
    }

    /* Report status pills */
    .rs-pending  { background:#FEF3C7; color:#92400E; }
    .rs-approved { background:#D1FAE5; color:#065F46; }
    .rs-revision { background:#FEE2E2; color:#991B1B; }
    .rs-reviewed { background:#DBEAFE; color:#1E40AF; }

    /* Documents page */
    .doc-type-card {
      background:#fff; border:1px solid #FED7AA; border-radius:14px;
      padding:1.25rem; cursor:pointer; transition:box-shadow .15s, border-color .15s;
      display:flex; flex-direction:column; gap:.5rem;
    }
    .doc-type-card:hover { box-shadow:0 4px 16px rgba(234,88,12,.12); border-color:#EA580C; }
    .doc-type-icon { font-size:1.75rem; line-height:1; }
    .doc-type-name { font-family:Sora,sans-serif; font-weight:700; color:#1A0A00; font-size:.9rem; }
    .doc-type-desc { font-size:.76rem; color:#9A6647; line-height:1.5; }
    .doc-type-required { font-size:.68rem; font-weight:700; color:#EA580C; text-transform:uppercase; letter-spacing:.04em; }

    .doc-row {
      background:#fff; border:1px solid #FED7AA; border-radius:12px;
      padding:1rem 1.25rem; margin-bottom:.6rem;
      display:flex; align-items:center; gap:1rem; flex-wrap:wrap;
      transition:box-shadow .15s;
    }
    .doc-row:hover { box-shadow:0 4px 12px rgba(234,88,12,.08); }
    .doc-row-icon { font-size:1.5rem; flex-shrink:0; }
    .doc-row-info { flex:1; min-width:160px; }
    .doc-row-name { font-family:Sora,sans-serif; font-weight:700; color:#1A0A00; font-size:.875rem; }
    .doc-row-meta { font-size:.74rem; color:#9A6647; margin-top:.15rem; }
    .doc-row-actions { display:flex; gap:.4rem; flex-shrink:0; flex-wrap:wrap; }
    .ds-pending  { background:#FEF3C7; color:#92400E; }
    .ds-approved { background:#D1FAE5; color:#065F46; }
    .ds-rejected { background:#FEE2E2; color:#991B1B; }
    .ds-missing  { background:#F3F4F6; color:#6B7280; }
  </style>
</head>

const Helpers = {

  pageHeader(title, subtitle = '', action = null) {
    const wrap = document.createElement('div');
    wrap.className = 'cui-page-header';
    const left = document.createElement('div');
    left.innerHTML = `
      <div class="cui-page-title">${title}</div>
      ${subtitle ? `<div class="cui-page-subtitle">${subtitle}</div>` : ''}`;
    wrap.appendChild(left);
    if (action) wrap.appendChild(action);
    return wrap;
  },

  // Orange filled button — primary actions
  orangeBtn(label, onClick) {
    return UI.button(label, {
      size: 'sm',
      color: { base:'#EA580C', hover:'#C2410C', text:'#fff' },
      onClick,
    });
  },

  // Ghost button with orange hover — secondary actions
  ghostBtn(label, onClick) {
    return UI.button(label, {
      variant: 'ghost', size: 'sm',
      color: { base:'#FFF7ED', hover:'#FFEDD5', text:'#EA580C', border:'#FED7AA' },
      onClick,
    });
  },

  // Green approve button
  approveBtn(label, onClick) {
    return UI.button(label, {
      size: 'sm',
      color: { base:'#10B981', hover:'#059669', text:'#fff' },
      onClick,
    });
  },

  // Red reject button
  rejectBtn(label, onClick) {
    return UI.button(label, {
      size: 'sm',
      color: { base:'#FEF2F2', hover:'#FEE2E2', text:'#991B1B', border:'#FECACA' },
      onClick,
    });
  },

  // Intern avatar circle
  internAvatar(name, size = 'sm') {
    const av = UI.avatar(name, size);
    av.style.background = 'linear-gradient(135deg,#FF6B00,#EA580C)';
    av.style.flexShrink = '0';
    return av;
  },

  // Sidebar footer chip — avatar + name + role
  sidebarFooter(name, role) {
    const wrap = document.createElement('div');
    wrap.style.cssText = 'display:flex;align-items:center;gap:.65rem';
    const av = UI.avatar(name, 'sm');
    av.style.cssText = 'background:rgba(255,255,255,.22);border:1.5px solid rgba(255,255,255,.35)';
    const info = document.createElement('div');
    info.style.minWidth = '0';
    info.innerHTML = `
      <div style="font-size:.85rem;font-weight:700;color:#fff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${name}</div>
      <div style="font-size:.72rem;color:rgba(255,255,255,.6)">${role}</div>`;
    wrap.append(av, info);
    return wrap;
  },

  // Swap content of a card container by id
  refreshCard(id, buildFn) {
    const el = document.getElementById(id);
    if (!el) return;
    el.innerHTML = '';
    el.appendChild(buildFn());
  },
  async api(action, extra = {}) {
    const res  = await fetch('config/api.php', {
      method:  'POST',
      headers: { 'Content-Type': 'application/json' },
      body:    JSON.stringify({ action, ...extra }),
    });
    return res.json();
  },
};

async function setCurrentPage(page) {

  try {

    const res = await fetch('config/api.php', {
      method: 'POST',

      headers: {
        'Content-Type': 'application/json'
      },

      body: JSON.stringify({
        action: 'setCurrentPage',
        page: page
      })
    });
   // console.warn("JS PAGE: "+page);
    const data = await res.json();
   // console.log('Set current page response:', data);
    return data;

  } catch (err) {

    console.error(err);

    return {
      error: 'Failed to save current page'
    };
  }
}

function navigate(name) {
  document.querySelectorAll('.cui-section').forEach(s => s.classList.remove('active'));
  document.getElementById('sec-' + name).classList.add('active');
  sidebar.setActive(SECTIONS[name]);
  const center = document.querySelector('.cui-navbar-center');
  if (center) center.textContent = SECTIONS[name];
  // Charts must be drawn after their canvas is visible
  if (name === 'analytics') setTimeout(() => Analytics.drawAllCharts(), 30);
  setCurrentPage(name)
}

  // Quick view of pending registrations on dashboard
  pendingApprovalsCard() {
    const body = document.createElement('div');
    getPendingInterns().then(data => {
      PENDING = (data && !data.error) ? data : [];

      if (!PENDING.length) {
        //body.appendChild(UI.empty('✅', 'All caught up!', 'No pending registrations.'));
        const container = document.getElementById('pending-approvals-card-container');

          const item = document.createElement('div');

          item.append(Helpers.internAvatar(p.name), info, btn);
          body.appendChild(item);
        });

        if (PENDING.length > 3) {
          const more = document.createElement('p');
          more.style.cssText = 'font-size:.78rem;color:#9A6647;text-align:center;padding:.5rem 0 0';
          more.textContent   = `+${PENDING.length - 3} more pending`;
          body.appendChild(more);
        }
      }
      const container = document.getElementById('pending-approvals-card-container');
      container.appendChild(UI.card({
        title: '⏳ Pending Approvals',
        headerActions: UI.badge(PENDING.length, { base:'#FEF3C7', text:'#92400E' }),
        body,
        footer: PENDING.length ? [
          Helpers.ghostBtn('View all →', () => navigate('approvals')),
        ] : [],

    const pending = REPORTS.filter(r => r.status === 'pending');
    const recent  = REPORTS.slice(0, 3);
    const body    = document.createElement('div');
    const sl = { pending:'rs-pending', approved:'rs-approved', revision:'rs-revision', reviewed:'rs-reviewed' };
    const tl = { pending:'⏳ Pending', approved:'✅ Approved', revision:'🔁 Revision', reviewed:'👁 Reviewed' };

    if (!REPORTS.length) {
      body.appendChild(UI.empty('📭', 'No reports yet', ''));
    } else {
      recent.forEach(r => {
        const item = document.createElement('div');
        item.style.cssText = 'display:flex;align-items:center;gap:.6rem;padding:.6rem 0;border-bottom:1px solid #FFF0E0';
        const left = document.createElement('div');
        left.style.flex = '1';
        left.innerHTML = `
          <div style="font-weight:700;font-size:.82rem;color:#1A0A00">${r.internName}</div>
          <div style="font-size:.73rem;color:#9A6647">${r.week}</div>`;
        const badge = document.createElement('span');
        badge.className   = 'cui-badge ' + sl[r.status];
        badge.textContent = tl[r.status];
        item.append(left, badge);
        body.appendChild(item);
      });
    }

    return UI.card({
      title: '📄 Weekly Reports',
      headerActions: UI.badge(pending.length + ' pending', { base:'#FEF3C7', text:'#92400E' }),
      body,
      footer: REPORTS.length ? [Helpers.ghostBtn('View all →', () => navigate('reports'))] : [],
    });
  },

  // Analytics snapshot card on dashboard
  analyticsPreviewCard() {
    const avgPct  = Math.round(INTERNS.reduce((s,i) => s + (i.totalHours/500*100), 0) / (INTERNS.length||1));
    const behind  = INTERNS.filter(i => (i.totalHours/500*100) < 70).length;
    const onPace  = INTERNS.length - behind;

    const body = document.createElement('div');

    // Mini donut-style completion ring using a progress arc
    const ringWrap = document.createElement('div');
    ringWrap.style.cssText = 'text-align:center;padding:.75rem 0 .5rem';
    ringWrap.innerHTML = `
      <div style="font-family:Sora,sans-serif;font-size:2rem;font-weight:800;color:#EA580C;line-height:1">${avgPct}%</div>
      <div style="font-size:.75rem;color:#9A6647;margin-top:.2rem">batch avg completion</div>`;
    body.appendChild(ringWrap);

    body.appendChild(UI.progress(avgPct, { color:{ base:'#EA580C' }, label:false }));

    // Quick stats
    body.appendChild(UI.statRow([
      { value: onPace, label: 'On Schedule', color: '#10B981' },
      { value: behind, label: 'Behind',      color: '#EF4444' },
    ]));

    const btn = Helpers.ghostBtn('View Full Analytics →', () => navigate('analytics'));
    btn.style.width     = '100%';
    btn.style.marginTop = '.75rem';
    btn.style.justifyContent = 'center';
    body.appendChild(btn);

    return UI.card({ title: '📊 Analytics Snapshot', body });
  },

  // Recent announcements compact list
  recentAnnouncementsCard() {
    const body = document.createElement('div');

    if (!ANNOUNCEMENTS.length) {
      body.appendChild(UI.empty('📭', 'No announcements yet', ''));
      return UI.card({ title: '📢 Recent Announcements', body });
    }

    [...ANNOUNCEMENTS]
      .sort((a, b) => b.pinned - a.pinned)
      .slice(0, 3)
      .forEach(ann => {
        const item = document.createElement('div');
        item.style.cssText = 'padding:.65rem 0;border-bottom:1px solid #FFF0E0';
        item.innerHTML = `
          <div style="display:flex;align-items:center;gap:.4rem;flex-wrap:wrap;margin-bottom:.15rem">
            ${ann.pinned ? `<span class="cui-badge" style="background:#FFF7ED;color:#EA580C;border:1px solid #FED7AA;font-size:.68rem">📌</span>` : ''}
            <span style="font-family:Sora,sans-serif;font-weight:700;font-size:.875rem;color:#1A0A00">${ann.title}</span>
          </div>
          <div style="font-size:.78rem;color:#9A6647">${ann.date}</div>`;
        body.appendChild(item);
      });

    return UI.card({
      title: '📢 Recent Announcements',
      headerActions: Helpers.ghostBtn('Manage →', () => navigate('announcements')),
      body,
    });
  },
};

const Approvals = {

  build() {
    const sec = document.getElementById('sec-approvals');
    sec.innerHTML = '';
    sec.appendChild(Helpers.pageHeader(
      'Pending Approvals',
      'Review and approve intern registration requests'
    ));

    const listWrap = document.createElement('div');
    listWrap.id = 'approvals-list-wrap';
    sec.appendChild(listWrap);
    fetch('config/api.php', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        action: 'getPendingInterns'
      })
    })
    .then(res => {
      console.log('API response status:', res.status);
      return res.json();
    })
    .then(data => {
      PENDING = data
    this.renderList();
    })
    .catch(error => {
      console.error('Fetch error:', error);
    });

  },
  renderList() {

    const wrap = document.getElementById('approvals-list-wrap');
    if (!wrap) return;
    wrap.innerHTML = '';

    if (!PENDING.length) {
      wrap.appendChild(UI.empty(
        '✅', 'No pending approvals',
        'All registration requests have been reviewed.'
      ));
      return;
    }

    // Header info
    const info = document.createElement('p');
    info.style.cssText = 'font-size:.85rem;color:#9A6647;margin-bottom:1rem';
    info.textContent   = `${PENDING.length} intern${PENDING.length !== 1 ? 's' : ''} waiting for approval. Approved interns can log in and access the intern portal.`;
    wrap.appendChild(info);

    PENDING.forEach(p => wrap.appendChild(this.approvalCard(p)));
  },

  // Single pending registration card
  approvalCard(p) {
    const wrap = document.createElement('div');
    wrap.className = 'approval-card';
    wrap.id        = `approval-${p.id}`;

    // Avatar
    wrap.appendChild(Helpers.internAvatar(p.name, 'md'));

    // Info
    const info = document.createElement('div');
    info.className = 'approval-info';
    info.innerHTML = `
      <div class="approval-name">${p.name}</div>
      <div class="approval-meta">
        ${p.email}
        <span style="margin:0 .3rem;opacity:.4">·</span>
        ${p.course}
        <span style="margin:0 .3rem;opacity:.4">·</span>
        ${p.year_level}
      </div>
      <div style="font-size:.72rem;color:#C4845A;margin-top:.2rem">
        Registered: ${p.created_at}
      </div>`;
    wrap.appendChild(info);

    // Pending badge
    const badge = document.createElement('div');
    badge.className = 'approval-badge';
    badge.appendChild(UI.badge('⏳ Pending', { base:'#FEF3C7', text:'#92400E' }));
    wrap.appendChild(badge);

    // Action buttons
    const actions = document.createElement('div');
    actions.className = 'approval-actions';

    actions.appendChild(UI.button('👁 View', {
      variant: 'ghost', size: 'sm',
      color: { base:'#FFF7ED', hover:'#FFEDD5', text:'#EA580C', border:'#FED7AA' },
      onClick: () => this.openDetailModal(p),
    }));

    actions.appendChild(Helpers.approveBtn('✅ Approve', () => this.approveIntern(p.id)));
    actions.appendChild(Helpers.rejectBtn('✗ Reject',   () => this.rejectIntern(p.id)));

    wrap.appendChild(actions);
    return wrap;
  },

  // Full registration detail modal before approving
  openDetailModal(p) {
    const body = document.createElement('div');

    // Profile header
    const header = document.createElement('div');
    header.style.cssText = 'display:flex;align-items:center;gap:1rem;margin-bottom:1.5rem;padding-bottom:1.25rem;border-bottom:1px solid #FED7AA';
    const info = document.createElement('div');
    info.innerHTML = `
      <div style="font-family:Sora,sans-serif;font-size:1.05rem;font-weight:800;color:#1A0A00">${p.name}</div>
      <div style="font-size:.8rem;color:#9A6647;margin-top:.15rem">${p.email}</div>
      <div style="font-size:.8rem;color:#9A6647">${p.dept} · ${p.school}</div>`;
    header.append(Helpers.internAvatar(p.name, 'lg'), info);
    body.appendChild(header);

    // Registration info rows
    [
      ['📧', 'Email',       p.email],
      ['📚', 'Course/Dept', p.dept],
      ['🏫', 'School',      p.school],
      ['📅', 'Registered',  p.created_at],
    ].forEach(([icon, label, value]) => body.appendChild(UI.infoRow(icon, label, value)));

    // Status notice
    const notice = document.createElement('div');
    notice.style.cssText = 'margin-top:1.25rem;padding:.85rem 1rem;background:#FEF3C7;border:1px solid #FDE68A;border-radius:10px;font-size:.83rem;color:#92400E';
    notice.innerHTML = '⚠️ <strong>Pending approval.</strong> This intern cannot access the system until you approve their account.';
    body.appendChild(notice);

    const m = UI.modal({
      title: '📋 Registration Details',
      body,
      size: 'lg',
      footer: [
        UI.button('Close', { variant:'ghost', size:'sm', onClick: () => m.close() }),
        Helpers.rejectBtn('✗ Reject', () => {
          this.rejectIntern(p.id);
          m.close();
        }),
        Helpers.approveBtn('✅ Approve', () => {
          this.approveIntern(p.id);
          m.close();
        }),
      ],
    });
    m.open();
  },

  // Approve — moves from PENDING to INTERNS
  approveIntern(id) {
    fetch('config/api.php', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        action: 'approavePendingIntern',
        internId: id,
      })
    })
    const idx = PENDING.findIndex(p => p.id === id);
    if (idx === -1) return;

    const p = PENDING[idx];

    // Add to approved interns list with default stats
    INTERNS.push({
      id:          p.id,
      name:        p.name,
      email:       p.email,
      dept:        p.course,
      school:      p.year_level,
      company:     '—',
      supervisor:  '—',
      totalHours:  0,
      daysPresent: 0,
      reports:     0,
    });

    // Remove from pending
    PENDING.splice(idx, 1);

    // Update sidebar badge
    sidebar.setActive('Pending Approvals'); // triggers re-render of badge count
    this.renderList();
    this.updateApprovalsBadge();

    UI.toast(`✅ ${p.name} has been approved and can now log in.`, 'success');
  },

  // Reject — removes from PENDING with confirmation
  rejectIntern(id) {
    const p = PENDING.find(p => p.id === id);
    if (!p) return;
    if (!confirm(`Reject the registration of ${p.name}?\nThis will delete their account.`)) return;

    PENDING = PENDING.filter(p => p.id !== id);
    this.renderList();
    this.updateApprovalsBadge();

    UI.toast(`Registration for ${p.name} has been rejected.`, 'danger');
  },

  // Refresh the sidebar badge count after approve/reject
  updateApprovalsBadge() {
    // Re-build sidebar to update badge — simple approach for frontend demo
    // With PHP backend you'd just reload the page after the API call
    const badgeEl = document.querySelector('#intern-sidebar .cui-ps-btn-badge');
    if (badgeEl && PENDING.length === 0) badgeEl.remove();
    else if (badgeEl) badgeEl.textContent = PENDING.length;
  },
};

    dept.addEventListener('change', e => { filterDept = e.target.value; this.renderTable(); });

    const sort  = UI.select({ options: [
      { value:'name',    label:'Sort: Name A–Z'    },
      { value:'hours',   label:'Sort: Most Hours'  },
      { value:'days',    label:'Sort: Most Days'   },
      { value:'reports', label:'Sort: Most Reports'},

    sort.addEventListener('change', e => { filterSort = e.target.value; this.renderTable(); });

    return bar;

  tableContainer() {
    const wrap = document.createElement('div');
    wrap.id = 'interns-table-wrap';
    return wrap;

  filteredList() {

    return INTERNS_LIST

      // -----------------------------------
      // Flatten needed fields only
      // -----------------------------------
      .map(i => {

        const internship = i.internships?.[0] || {};
        const company    = internship.company || {};

        return {

          // User
          id: i.user?.id || '',
          name: i.user?.name || '',
          email: i.user?.email || '',
          dept: i.profile?.position || '',

          // Company
          company: company.name || '',
          companyAddress: company.address || '',

          // Internship
          supervisor: internship.supervisor || '',
          supervisorPhone: internship.supervisor_phone || '',
          startDate: internship.start_date || '',
          endDate: internship.end_date || '',

          daysPresent: internship.days_present || 0,
          totalHours: internship.total_hours || 0,
          reportsSubmitted: internship.reports_submitted || 0,
        };
      })

      // -----------------------------------
      // Filters
      // -----------------------------------
      .filter(i =>

        (!filterSearch ||

          i.name.toLowerCase().includes(filterSearch) ||

          i.email.toLowerCase().includes(filterSearch)
        ) &&

        (!filterDept || i.company === filterDept)
      )

      // -----------------------------------
      // Sorting
      // -----------------------------------
      .sort((a, b) => ({

        name:
          a.name.localeCompare(b.name),

        hours:
          b.totalHours - a.totalHours,

        days:
          b.daysPresent - a.daysPresent,

        reports:
          b.reportsSubmitted - a.reportsSubmitted,

      }[filterSort] ?? 0));

    body.appendChild(UI.progress(pct, { color: { base:'#EA580C' }, label: true }));

    compLabel.textContent   = 'Internship Details';
    body.appendChild(compLabel);
    body.appendChild(UI.companyInfoCard({
      company:    intern.company,
      position:   intern.dept + ' Intern',
      supervisor: intern.supervisor,
    }));

      title: '👤 Intern Details', body, size: 'lg',

        Helpers.orangeBtn('Send Message', () => { UI.toast('Messaging coming soon!', 'info'); }),
      ],
    });

  async getInternsList() {

    try {

      const res = await fetch('config/api.php', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },

        body: JSON.stringify({
          action: 'getCoordinatorInternDatas'
        })
      });

      const data = await res.json();
      //console.log('InternList ' + JSON.stringify(data, null, 2));

      if (!res.ok || data.error) {
        console.error(data.error || 'Failed to fetch intern data');
        INTERNS_LIST = [];
      }

      INTERNS_LIST = data;

    } catch (err) {

      console.error('Fetch error:', err);
      INTERNS_LIST = [];
    }
  },
  downloadExcel(data) {
    if (!data || !data.length) {
      UI.toast('Table is empty or not loaded yet.', 'info');
      return;
    }
    const worksheet = XLSX.utils.json_to_sheet(data);

    const workbook = XLSX.utils.book_new();

    XLSX.utils.book_append_sheet(
      workbook,
      worksheet,
      'Interns'
    );

    XLSX.writeFile(
      workbook,
      'interns.xlsx'
    );
  }
};

const Announcements = {

build() {
    const sec = document.getElementById('sec-announcements');
    if (!sec) return; // Safety check

    sec.appendChild(Helpers.pageHeader(
      'Announcements',
      'Post updates and notices for all interns',
      Helpers.orangeBtn('+ New Announcement', () => this.openCreateModal())
    ));

    const listWrap = document.createElement('div');
    listWrap.id = 'ann-list-wrap';
    sec.appendChild(listWrap);

    // CHANGE THIS: Call fetch instead of render
    this.fetchAnnouncements(); 
  },

  renderList() {
      const wrap = document.getElementById('ann-list-wrap');
      if (!wrap) return;

      // Remove the .then() and fetch call from here!
      wrap.innerHTML = '';
      
      if (!ANNOUNCEMENTS.length) {
        wrap.appendChild(UI.empty('📭', 'No announcements yet', 'Post your first update.',
          Helpers.orangeBtn('+ New Announcement', () => this.openCreateModal())));
        return;
      }

      [...ANNOUNCEMENTS].sort((a,b) => b.pinned - a.pinned)
        .forEach(ann => wrap.appendChild(this.annItem(ann)));
    },

async fetchAnnouncements() {
      const wrap = document.getElementById('ann-list-wrap');
      if (wrap) wrap.innerHTML = '<p style="padding:2rem; text-align:center; color:#6B3A1F;">Loading announcements...</p>';

      try {
          const response = await fetch('config/api.php', { // Ensure this path is correct!
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ action: 'getAnnouncements' })
          });

          const data = await response.json();
          console.log("Data received:", data); // Check your browser console!

          ANNOUNCEMENTS = data.map(ann => ({
              id: ann.id,
              title: ann.title,
              body: ann.body,
              pinned: parseInt(ann.is_pinned) === 1,
              author: "Coordinator", 
              date: new Date(ann.created_at).toLocaleDateString('en-US', { 
                  month: 'short', day: 'numeric', year: 'numeric' 
              })
          }));

          this.renderList(); 
      } catch (error) {
          console.error('Error fetching announcements:', error);
          if (wrap) wrap.innerHTML = '';
          UI.toast('Could not load announcements.', 'danger');
      }
  },
  
  
  annItem(ann) {
    const wrap = document.createElement('div');
    wrap.className = 'ann-item' + (ann.pinned ? ' pinned' : '');

    const body = document.createElement('div');
    body.className = 'ann-item-body';
    body.innerHTML = `
      ${ann.pinned ? '<span style="font-size:.72rem;font-weight:700;color:#EA580C;display:block;margin-bottom:.2rem">📌 Pinned</span>' : ''}
      <div class="ann-item-title">${ann.title}</div>
      <div class="ann-item-text">${ann.body}</div>
      <div class="ann-item-meta">By ${ann.author} · ${ann.date}</div>`;

    const actions = document.createElement('div');
    actions.className = 'ann-item-actions';

    actions.appendChild(Helpers.ghostBtn(ann.pinned ? 'Unpin' : '📌 Pin', () => {
      ann.pinned = !ann.pinned;
      this.renderList();
      UI.toast(ann.pinned ? 'Pinned.' : 'Unpinned.', 'info');
      this.togglePin(ann)
    }));
    actions.appendChild(Helpers.ghostBtn('✏️ Edit', () => this.openEditModal(ann)));
    actions.appendChild(UI.button('🗑 Delete', {
      variant:'ghost', size:'sm',
      color: { base:'#FEF2F2', hover:'#FEE2E2', text:'#991B1B', border:'#FECACA' },
    onClick: async () => {
        if (!confirm(`Delete "${ann.title}"?`)) return;
        const result = await this.removeAnnouncement(ann.id);
        if (result.success) {
            ANNOUNCEMENTS = ANNOUNCEMENTS.filter(a => a.id !== ann.id);
            this.renderList();
            UI.toast('Deleted.', 'danger');
        } else {
            UI.toast(result.message, 'danger');
        }
    }
    }));

    wrap.append(body, actions);
    return wrap;
  },

// Store the form reference outside the function so it persists
  formCache: null,
  buildForm({ title = '', body = '', pinned = false } = {}) {
      // 1. If form doesn't exist yet, create it once
      if (!this.formCache) {
          const wrap = document.createElement('div');
          
          wrap.appendChild(UI.formGroup('Title',
              UI.input({ id: 'ann-form-title', placeholder: 'Announcement title', required: true }),
              '', { required: true }));
              
          wrap.appendChild(UI.formGroup('Message',
              UI.textarea({ id: 'ann-form-body', placeholder: 'Write your message…', rows: 5 })));
              
          const pinLabel = document.createElement('label');
          pinLabel.style.cssText = 'display:flex;align-items:center;gap:.5rem;cursor:pointer;font-size:.85rem;font-weight:600;color:#6B3A1F;margin-top:.5rem';
          pinLabel.innerHTML = `<input type="checkbox" id="ann-form-pin" style="width:15px;height:15px;accent-color:#EA580C"> 📌 Pin this announcement`;
          
          wrap.appendChild(pinLabel);
          this.formCache = wrap;
      }

      // 2. Update the existing elements with the new values
      const titleInput = this.formCache.querySelector('#ann-form-title');
      const bodyInput = this.formCache.querySelector('#ann-form-body');
      const pinInput = this.formCache.querySelector('#ann-form-pin');

      if (titleInput) titleInput.value = title;
      if (bodyInput) bodyInput.value = body;
      if (pinInput) pinInput.checked = pinned;

      return this.formCache;
  },

  openCreateModal() {
      const m = UI.modal({
          title: '📢 New Announcement', 
          body: this.buildForm(), 
          size: 'lg',
          footer: [
              UI.button('Cancel', { variant: 'ghost', size: 'sm', onClick: () => m.close() }),
              Helpers.orangeBtn('Post Announcement', async () => {
                  const t = document.getElementById('ann-form-title')?.value.trim();
                  const b = document.getElementById('ann-form-body')?.value.trim();
                  const p = document.getElementById('ann-form-pin')?.checked ?? false;

                  if (!t || !b) { 
                      UI.toast('Please fill in all fields.', 'danger'); 
                      return; 
                  }
                  const result = await this.postAnnouncement(t, b, p);

                  if (result.success) {
                      ANNOUNCEMENTS.unshift({
                          id: result.id,
                          title: t,
                          body: b,
                          pinned: p,
                          author: COORDINATOR.name,
                          date: new Date().toLocaleDateString('en-US', { 
                              month: 'short', day: 'numeric', year: 'numeric' 
                          }),
                      });

                      this.renderList();
                      m.close();
                      UI.toast('Announcement posted!', 'success');
                  } else {
                      UI.toast(result.message, 'danger');
                  }
              }),
          ],
      });
      m.open();
  },

  openEditModal(ann) {
      const m = UI.modal({
          title: '✏️ Edit Announcement',
          body: this.buildForm(ann),
          footer: [
              UI.button('Cancel', { variant:'ghost', onClick: () => m.close() }),
              Helpers.orangeBtn('Save Changes', async () => {
                  const t = document.getElementById('ann-form-title').value;
                  const b = document.getElementById('ann-form-body').value;
                  const p = document.getElementById('ann-form-pin').checked;

                  const result = await this.updateAnnouncement(ann.id, t, b, p);
                  if (result.success) {
                      ann.title = t;
                      ann.body = b;
                      ann.pinned = p;
                      
                      this.renderList();
                      m.close();
                      UI.toast('Announcement updated!', 'success');
                  }
              })
          ]
      });
      m.open();
  },
  async togglePin(ann) {
      const newPinnedStatus = !ann.pinned;
      
      const result = await this.updateAnnouncement(
          ann.id, 
          ann.title, 
          ann.body, 
          newPinnedStatus
      );

      if (result.success) {
          ann.pinned = newPinnedStatus;
          this.renderList(); 
          UI.toast(ann.pinned ? 'Announcement Pinned' : 'Announcement Unpinned', 'info');
      } else {
          UI.toast(result.message || 'Failed to update pin status', 'danger');
      }
  },
  async fetchAnnouncements() {
      try {
          const response = await fetch('config/api.php', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ action: 'getAnnouncements' })
          });

          const data = await response.json();

          ANNOUNCEMENTS = data.map(ann => ({
              id: ann.id,
              title: ann.title,
              body: ann.body,
              pinned: parseInt(ann.is_pinned) === 1,
              author: "Coordinator", // Or you can include the name in the PHP SQL Join
              date: new Date(ann.created_at).toLocaleDateString('en-US', { 
                  month: 'short', day: 'numeric', year: 'numeric' 
              })
          }));

          this.renderList();
      } catch (error) {
          console.error('Error fetching announcements:', error);
          UI.toast('Could not load announcements.', 'danger');
      }
  },
  async postAnnouncement(title, body, isPinned) {
      try {
          const response = await fetch('config/api.php', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                  action: 'addAnnouncement',
                  title: title,
                  body: body,
                  isPinned: isPinned ? 1 : 0
              })
          });

          return await response.json();
      } catch (error) {
          console.error('Fetch Error:', error);
          return { success: false, message: 'Network error. Please try again.' };
      }
  },
  async updateAnnouncement(id, title, body, isPinned) {
      try {
          const response = await fetch('config/api.php', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                  action: 'updateAnnouncement',
                  id: id,
                  title: title,
                  body: body,
                  isPinned: isPinned ? 1 : 0
              })
          });
          return await response.json();
      } catch (error) {
          return { success: false, message: 'Network error.' };
      }
  },

  async removeAnnouncement(id) {
      try {
          const response = await fetch('config/api.php', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ action: 'deleteAnnouncement', id: id })
          });
          return await response.json();
      } catch (error) {
          return { success: false, message: 'Network error.' };
      }
  }
};


// ─────────────────────────────────────────────────────────────
//  REPORTS  (weekly reports from all interns)
// ─────────────────────────────────────────────────────────────
const Reports = {

  build() {
    const sec = document.getElementById('sec-reports');
    sec.appendChild(Helpers.pageHeader(
      'Weekly Reports',
      'Review and give feedback on intern submissions'
    ));

    Helpers.api('getCoordinatorReports').then(data => {
      console.log('Reports data:', JSON.stringify(data, null, 2));
      
      // Use the database-driven intern_name returned by your query
      REPORTS = data.map(r => ({
        ...r,
        internName: r.intern_name || `Intern #${r.intern_id}`, 
        dept: r.dept || 'N/A' // Fallback if department tracking is added later
      }));

      sec.appendChild( this.statusTabs()     );
      sec.appendChild( this.tableContainer() );
      this.renderTable();
    });
  },

  // Status filter pill tabs
  statusTabs() {
    const wrap = document.createElement('div');
    wrap.style.cssText = 'display:flex;flex-wrap:wrap;gap:.4rem;margin-bottom:1.1rem';

    const tabs = [
      { value:'',         label:'All' },
      { value:'pending',  label:'⏳ Pending'  },
      { value:'reviewed', label:'👁 Reviewed' },
      { value:'approved', label:'✅ Approved' },
      { value:'revision', label:'🔁 Revision' },
    ];

    tabs.forEach(t => {
      const count = t.value === '' ? REPORTS.length : REPORTS.filter(r => r.status === t.value).length;
      const btn   = document.createElement('button');
      btn.style.cssText = 'display:flex;align-items:center;gap:.35rem;padding:.4rem .9rem;border-radius:20px;font-size:.8rem;font-weight:600;font-family:inherit;cursor:pointer;transition:all .15s;border:1.5px solid #FED7AA;background:#fff;color:#9A6647';
      btn.innerHTML     = `${t.label} <span style="opacity:.65">(${count})</span>`;
      btn.dataset.value = t.value;

      if (reportFilterStatus === t.value) {
        btn.style.background = '#EA580C';
        btn.style.borderColor= '#EA580C';
        btn.style.color      = '#fff';
      }

      btn.addEventListener('click', () => {
        reportFilterStatus = t.value;
        // Update tab styles
        wrap.querySelectorAll('button').forEach(b => {
          const active = b.dataset.value === t.value;
          b.style.background  = active ? '#EA580C' : '#fff';
          b.style.borderColor = active ? '#EA580C' : '#FED7AA';
          b.style.color       = active ? '#fff' : '#9A6647';
        });
        this.renderTable();
      });

      wrap.appendChild(btn);
    });

    return wrap;
  },

  tableContainer() {
    const wrap = document.createElement('div');
    wrap.id = 'reports-table-wrap';
    return wrap;
  },

  filteredList() {
    return REPORTS.filter(r => !reportFilterStatus || r.status === reportFilterStatus);
  },

  renderTable() {
    const wrap = document.getElementById('reports-table-wrap');
    if (!wrap) return;
    wrap.innerHTML = '';

    const list = this.filteredList();
    const sl   = { pending:'rs-pending', approved:'rs-approved', revision:'rs-revision', reviewed:'rs-reviewed' };
    const tl   = { pending:'⏳ Pending', approved:'✅ Approved', revision:'🔁 Revision', reviewed:'👁 Reviewed' };

    const tbl = UI.table([
      { key:'internName', label:'Intern',
        render: (v, row) => {
          const cell = document.createElement('div');
          cell.style.cssText = 'display:flex;align-items:center;gap:.6rem';
          const info = document.createElement('div');
          info.innerHTML = `
            <div style="font-weight:700;color:#1A0A00">${v}</div>
            <div style="font-size:.75rem;color:#9A6647">${row.dept}</div>`;
          cell.append(Helpers.internAvatar(v), info);
          return cell;
        }},
      { key:'week_label',   label:'Week',     render: v => `<span style="font-size:.82rem; text-transform: capitalize;">${v}</span>` },
      { key:'files',   label:'Files',
        render: files => {
          if (!files || files.length === 0) return `<span style="font-size:.8rem;color:#999;font-style:italic">No files</span>`;
          return files.map(f => 
            `<a href="/uploads/${f.file_path}" target="_blank" style="display:block;color:#EA580C;font-size:.8rem;text-decoration:none;margin-bottom:.2rem" title="${f.file_name}">📄 ${f.file_name}</a>`
          ).join('');
        }},
      { key:'uploaded_at',   label:'Submitted', render: v => `<span style="font-size:.8rem;color:#9A6647">${v}</span>` },
      { key:'status', label:'Status', align:'center',
        render: v => {
          const b = document.createElement('span');
          b.className   = 'cui-badge ' + sl[v];
          b.textContent = tl[v];
          return b;
        }},
      { key:'id', label:'', align:'center',
        render: (_, row) => Helpers.orangeBtn('Review', () => this.openReviewModal(row)) },
    ], list, {
      hoverable: true,
      emptyText: 'No reports match this filter.',
    });

    wrap.appendChild(UI.card({
      title:   `${list.length} report${list.length !== 1 ? 's' : ''} ${reportFilterStatus ? '— ' + reportFilterStatus : ''}`,
      padding: false,
      body:    tbl,
    }));
  },

  // Review modal — read report + set status + write feedback
  openReviewModal(report) {
    const sl = { pending:'rs-pending', approved:'rs-approved', revision:'rs-revision', reviewed:'rs-reviewed' };
    const tl = { pending:'⏳ Pending', approved:'✅ Approved', revision:'🔁 Revision', reviewed:'👁 Reviewed' };
    let   selectedStatus = report.status;

    const body = document.createElement('div');

    // Header
    const hdr = document.createElement('div');
    hdr.style.cssText = 'display:flex;align-items:center;gap:.75rem;margin-bottom:1.25rem;padding-bottom:1rem;border-bottom:1px solid #FED7AA';
    hdr.innerHTML = `
      <div style="flex:1">
        <div style="font-family:Sora,sans-serif;font-weight:800;color:#1A0A00;font-size:1rem">${report.internName}</div>
        <div style="font-size:.8rem;color:#9A6647;margin-top:.15rem;text-transform: capitalize;">${report.week_label} · ${report.dept}</div>
        <div style="font-size:.8rem;color:#9A6647">Submitted: ${report.uploaded_at}</div>
      </div>`;
    const badge = document.createElement('span');
    badge.className   = 'cui-badge ' + sl[report.status];
    badge.textContent = tl[report.status];
    hdr.appendChild(badge);
    body.appendChild(hdr);

    // File container
    const filesWrap = document.createElement('div');
    filesWrap.style.cssText = 'display:flex;flex-direction:column;gap:.5rem;margin-bottom:1.25rem';
    
    if (report.files && report.files.length > 0) {
      report.files.forEach(f => {
        const fileLink = document.createElement('a');
        fileLink.href   = `/uploads/${f.file_path}`;
        fileLink.target = '_blank';
        fileLink.style.cssText = 'display:flex;align-items:center;gap:.5rem;padding:.75rem 1rem;background:#FFF7ED;border:1px solid #FED7AA;border-radius:10px;text-decoration:none;color:#EA580C;font-weight:600;font-size:.875rem';
        fileLink.innerHTML = `📄 ${f.file_name} <span style="margin-left:auto;font-size:.75rem;color:#9A6647">Click to open</span>`;
        filesWrap.appendChild(fileLink);
      });
    } else {
      filesWrap.innerHTML = `<div style="font-size:.85rem;color:#999;font-style:italic">No files attached to this report.</div>`;
    }
    body.appendChild(filesWrap);

    // Status selector buttons
    const statusLabel = document.createElement('div');
    statusLabel.style.cssText = 'font-size:.8rem;font-weight:700;color:#6B3A1F;margin-bottom:.5rem';
    statusLabel.textContent   = 'Set Status';
    body.appendChild(statusLabel);

    const btnRow = document.createElement('div');
    btnRow.style.cssText = 'display:grid;grid-template-columns:1fr 1fr;gap:.5rem;margin-bottom:1.25rem';

    const statusOptions = [
      { value:'reviewed', label:'👁 Mark Reviewed', base:'#DBEAFE', text:'#1E40AF', activeBg:'#1E40AF' },
      { value:'approved', label:'✅ Approve',        base:'#D1FAE5', text:'#065F46', activeBg:'#10B981' },
      { value:'revision', label:'🔁 Needs Revision', base:'#FEE2E2', text:'#991B1B', activeBg:'#EF4444' },
      { value:'pending',  label:'⏳ Keep Pending',   base:'#FEF3C7', text:'#92400E', activeBg:'#F59E0B' },
    ];

    statusOptions.forEach(opt => {
      const btn = document.createElement('button');
      btn.style.cssText = `padding:.55rem .75rem;border-radius:8px;font-size:.82rem;font-weight:600;font-family:inherit;cursor:pointer;border:2px solid transparent;transition:all .15s;background:${opt.base};color:${opt.text}`;
      btn.textContent   = opt.label;
      btn.dataset.value = opt.value;

      const highlight = () => {
        btnRow.querySelectorAll('button').forEach(b => {
          b.style.borderColor = 'transparent';
          b.style.transform   = 'none';
        });
        btn.style.borderColor = opt.activeBg;
        btn.style.transform   = 'scale(1.02)';
      };

      if (selectedStatus === opt.value) highlight();

      btn.addEventListener('click', () => {
        selectedStatus = opt.value;
        highlight();
      });
      btnRow.appendChild(btn);
    });
    body.appendChild(btnRow);

    // Feedback textarea
    body.appendChild(UI.formGroup('Feedback for Intern (optional)',
      UI.textarea({
        id:          'review-feedback',
        value:       report.feedback || '',
        placeholder: 'Write your comments or suggestions…',
        rows:        3,
      })
    ));

    const m = UI.modal({
      title: '📝 Review Report',
      body,
      size: 'lg',
      footer: [
        UI.button('Cancel', { variant:'ghost', size:'sm', onClick: () => m.close() }),
        Helpers.orangeBtn('Save Review', () => {
          const feedback = document.getElementById('review-feedback')?.value.trim() ?? '';
          report.status   = selectedStatus;
          report.feedback = feedback;
          this.renderTable();
          m.close();
          UI.toast('Review saved!', 'success');
        }),
      ],
    });
    m.open();
  },
};

const Analytics = {

  // Store chart instances so we can destroy before redrawing
  _charts: {},

  build() {
    const sec = document.getElementById('sec-analytics');
    sec.appendChild(Helpers.pageHeader(
      'Analytics',
      'Internship data insights for the current batch'
    ));

    // Top summary stat strip
    sec.appendChild( this.summaryStrip()  );

    // Two charts side by side
    const row1 = document.createElement('div');
    row1.className = 'pg-grid-2 mt-lg';
    row1.style.alignItems = 'start';
    row1.appendChild( this.completionChartCard()   );
    row1.appendChild( this.reportStatusChartCard() );
    sec.appendChild(row1);

    // Second row: attendance trend + dept comparison
    const row2 = document.createElement('div');
    row2.className = 'pg-grid-2 mt-lg';
    row2.style.alignItems = 'start';
    row2.appendChild( this.attendanceTrendCard()   );
    //row2.appendChild( this.deptComparisonCard()    );
    sec.appendChild(row2);

    // Behind schedule table
    sec.appendChild( this.behindScheduleCard() );

    // Draw charts after DOM is attached (brief delay ensures canvas is visible)
    setTimeout(() => this.drawAllCharts(), 50);
  },

  // ── Summary strip ─────────────────────────────────────────
  summaryStrip() {
    const totalHours  = INTERNS.reduce((s, i) => s + i.totalHours, 0);
    const avgHours    = Math.round(totalHours / (INTERNS.length || 1));
    const avgPct      = Math.round(INTERNS.reduce((s,i) => s + (i.totalHours/500*100), 0) / (INTERNS.length||1));
    const onPace      = INTERNS.filter(i => (i.totalHours / 500 * 100) >= 25).length; // >= 25% by week 14
    const rptApproved = REPORTS.filter(r => r.status === 'approved').length;

    return UI.statRow([
      { value: avgHours + 'h',        label: 'Avg Hours / Intern',  color: '#EA580C' },
      { value: avgPct + '%',           label: 'Avg Completion',      color: '#10B981' },
      { value: onPace + '/' + INTERNS.length, label: 'On Schedule', color: '#6366F1' },
      { value: rptApproved,            label: 'Reports Approved',    color: '#F59E0B' },
    ]);
  },

  // ── Intern completion bar chart ────────────────────────────
  completionChartCard() {
    const canvas = document.createElement('canvas');
    canvas.id     = 'chart-completion';
    canvas.height = 260;

    return UI.card({
      title: '📊 Intern Completion Rate',
      body:  canvas,
    });
  },

  drawCompletionChart() {
    const ctx = document.getElementById('chart-completion');
    if (!ctx) return;
    if (this._charts.completion) this._charts.completion.destroy();

    const sorted = [...INTERNS].sort((a,b) => b.totalHours - a.totalHours);
    const pcts   = sorted.map(i => Math.min(100, Math.round(i.totalHours / 500 * 100)));
    const colors = pcts.map(p => p >= 50 ? '#10B981' : p >= 25 ? '#F59E0B' : '#EF4444');

    this._charts.completion = new Chart(ctx, {
      type: 'bar',
      data: {
        labels:   sorted.map(i => i.name),
        datasets: [{
          label:           'Completion %',
          data:            pcts,
          backgroundColor: colors,
          borderRadius:    6,
          borderSkipped:   false,
        }],
      },
      options: {
        responsive: true,
        plugins: {
          legend: { display: false },
          tooltip: {
            callbacks: {
              label: ctx => {
                const intern = sorted[ctx.dataIndex];
                return ` ${ctx.parsed.y}%  (${intern.totalHours}h of 500h)`;
              },
            },
          },
        },
        scales: {
          y: {
            min: 0, max: 100,
            ticks: { callback: v => v + '%', font: { size: 11 } },
            grid:  { color: '#FFF0E0' },
          },
          x: { grid: { display: false }, ticks: { font: { size: 11 } } },
        },
      },
    });
  },

  // ── Report status donut chart ──────────────────────────────
  reportStatusChartCard() {
    const canvas = document.createElement('canvas');
    canvas.id     = 'chart-report-status';
    canvas.height = 220;

    const counts = {
      pending:  REPORTS.filter(r => r.status === 'pending').length,
      reviewed: REPORTS.filter(r => r.status === 'reviewed').length,
      approved: REPORTS.filter(r => r.status === 'approved').length,
      revision: REPORTS.filter(r => r.status === 'revision').length,
    };

    const body = document.createElement('div');
    body.appendChild(canvas);

    // Legend below chart
    const legend = document.createElement('div');
    legend.style.cssText = 'display:flex;flex-wrap:wrap;gap:.5rem 1rem;margin-top:.75rem;justify-content:center';
    [
      ['#FCD34D','Pending',  counts.pending],
      ['#93C5FD','Reviewed', counts.reviewed],
      ['#6EE7B7','Approved', counts.approved],
      ['#FCA5A5','Revision', counts.revision],
    ].forEach(([color, label, count]) => {
      const item = document.createElement('div');
      item.style.cssText = 'display:flex;align-items:center;gap:.3rem;font-size:.75rem;color:#6B3A1F';
      item.innerHTML = `<span style="width:10px;height:10px;border-radius:50%;background:${color};flex-shrink:0"></span>${label} (${count})`;
      legend.appendChild(item);
    });
    body.appendChild(legend);

    return UI.card({ title: '🍩 Report Status Breakdown', body });
  },

  drawReportStatusChart() {
    const ctx = document.getElementById('chart-report-status');
    if (!ctx) return;

  drawDeptChart() {
    const ctx = document.getElementById('chart-dept');
    if (!ctx) return;
    if (this._charts.dept) this._charts.dept.destroy();

    // Group interns by dept and average their completion
    const deptMap = {};

      deptMap[i.dept].push(Math.round(i.totalHours / 500 * 100));
    });
    const labels = Object.keys(deptMap);
    const avgs   = labels.map(d => {
      const vals = deptMap[d];
      return Math.round(vals.reduce((a,b) => a+b, 0) / vals.length);
    });

    this._charts.dept = new Chart(ctx, {
      type: 'bar',
      data: {
        labels,
        datasets: [{
          label:           'Avg Completion %',
          data:            avgs,

        }],
      },

        responsive: true,
        plugins: { legend: { display: false } },

          x: {

        },

    });

// ── Behind schedule table ──────────────────────────────────
  behindScheduleCard() {
    const behind = INTERNS
      .map(i => {
        const pct = Math.round(i.totalHours / 500 * 100);
        // Use your dynamic helper function instead of a hardcoded 70%
        const expectedPct = this.getExpectedPercentage(i); 
        
        return {
          ...i,
          pct: pct,
          // Gap is now calculated against their personal expected percentage
          gap: expectedPct - pct, 
        };
      })
      // An intern is only behind if their actual completion % is less than their expected %
      .filter(i => i.gap > 0) 
      .sort((a, b) => b.gap - a.gap);  // Sort by who has the largest gap (worst first)

    if (!behind.length) {
      return UI.card({
        title: '✅ Schedule Status',
        body: UI.empty('🎉', 'All interns are on schedule!', 'Everyone is meeting or exceeding their individual timeline goals.'),
      });
    }

    const tbl = UI.table([
      { key:'name',   label:'Intern',     render: v => `<strong>${v}</strong>` },
      { key:'dept',   label:'Dept' },
      { key:'totalHours', label:'Hours',  align:'center',
        render: v => `<span style="color:#EA580C;font-weight:700">${v}h</span>` },
      { key:'pct',    label:'Completion', align:'center',
        render: v => {
          const bar = document.createElement('div');
          bar.style.cssText = 'display:flex;align-items:center;gap:.5rem';
          const track = document.createElement('div');
          track.style.cssText = 'flex:1;height:6px;background:#FEE2E2;border-radius:10px;overflow:hidden';
          const fill  = document.createElement('div');
          fill.style.cssText  = `height:100%;width:${v}%;background:#EF4444;border-radius:10px`;
          track.appendChild(fill);
          bar.innerHTML = `<span style="font-size:.8rem;font-weight:700;color:#EF4444;width:35px">${v}%</span>`;
          bar.appendChild(track);
          return bar;
        }},
      { key:'gap',    label:'Behind By',  align:'center',
        render: v => UI.badge(v + '% behind', { base:'#FEE2E2', text:'#991B1B' }) },
    ], behind, { hoverable: true });

    return UI.card({
      title: `⚠️ Behind Schedule (${behind.length} intern${behind.length!==1?'s':''})`,
      padding: false,
      body: tbl,
    });
  },
  
  getExpectedPercentage (intern) {
    const currrentDate = new Date();
    const startDate = new Date(intern.startDate);
    const end_date = new Date(intern.endDate);
    const totalDuration = (end_date - startDate) / (1000 * 60 * 60 * 24); // in days
    const elapsedDuration = (currrentDate - startDate) / (1000 * 60 * 60 * 24); // in days
    const expectedPercentage = Math.min(100, Math.round((elapsedDuration / totalDuration) * 100));
    return expectedPercentage;
  },
  // Draw all charts at once
  drawAllCharts() {
    this.drawCompletionChart();
    this.drawReportStatusChart();
    this.drawAttendanceTrendChart();
    this.drawDeptChart();
  },


};

const CoordinatorDocuments = {

  // Live state tracking cache array
  _docs: [],

  _filterIntern: '',
  _filterType:   '',

  build() {
    const sec = document.getElementById('sec-documents');
    sec.innerHTML = '';

    sec.appendChild(Helpers.pageHeader(
      'Documents',

    Helpers.api('getCoordinatorDocuments').then(data => {

  _summaryStrip() {
    const docs    = this._docs;
    const pending  = docs.filter(d => d.status === 'pending').length;
    const approved = docs.filter(d => d.status === 'approved').length;
    const rejected = docs.filter(d => d.status === 'rejected').length;

      { value: total,    label: 'Total Submitted', color: '#EA580C' },
      { value: pending,  label: 'Pending Review',  color: '#F59E0B' },
      { value: approved, label: 'Approved',         color: '#10B981' },

  },

  _filterBar() {
    const bar = document.createElement('div');
    bar.className = 'cui-filter-bar';

    // Intern name search
    const search = UI.input({ placeholder: '🔍 Search intern name…' });
    search.addEventListener('input', e => {
      this._filterIntern = e.target.value.toLowerCase();
      this._renderList();
    });

    // Document type filter
    const types = ['TOR', 'Certificate of Completion', 'Endorsement Letter', 'Final Report', 'Waiver / MOA', 'Medical Certificate', 'Other'];
    const typeSelect = UI.select({ options: types, placeholder: 'All Document Types' });
    typeSelect.style.minWidth = '190px';
    typeSelect.addEventListener('change', e => {
      this._filterType = e.target.value;
      this._renderList();
    });

    // Status filter tabs (pill row)
    const tabs = document.createElement('div');
    tabs.style.cssText = 'display:flex;flex-wrap:wrap;gap:.4rem;align-items:center';
    [
      { value:'',         label:'All'       },
      { value:'pending',  label:'⏳ Pending' },
      { value:'approved', label:'✅ Approved'},
      { value:'rejected', label:'✗ Rejected' },
    ].forEach(t => {
      const btn = document.createElement('button');
      btn.style.cssText = 'padding:.35rem .8rem;border-radius:20px;font-size:.78rem;font-weight:600;font-family:inherit;cursor:pointer;transition:all .15s;border:1.5px solid #FED7AA;background:#fff;color:#9A6647;white-space:nowrap';
      btn.textContent   = t.label;
      btn.dataset.value = t.value;
      if (this._filterStatus === t.value) {
        btn.style.background  = '#EA580C';
        btn.style.borderColor = '#EA580C';
        btn.style.color       = '#fff';
      }
      btn.addEventListener('click', () => {
        this._filterStatus = t.value;
        tabs.querySelectorAll('button').forEach(b => {
          const active = b.dataset.value === t.value;
          b.style.background  = active ? '#EA580C' : '#fff';
          b.style.borderColor = active ? '#EA580C' : '#FED7AA';
          b.style.color       = active ? '#fff'    : '#9A6647';
        });
        this._renderList();
      });
      tabs.appendChild(btn);
    });

    bar.append(search, typeSelect, tabs);
    return bar;
  },

  _filtered() {
    return this._docs.filter(d =>
      (!this._filterIntern || d.internName.toLowerCase().includes(this._filterIntern)) &&
      (!this._filterType   || d.type === this._filterType) &&
      (!this._filterStatus || d.status === this._filterStatus)
    );
  },

  _renderList() {
    const wrap = document.getElementById('cdoc-list-wrap');

        title: 'Submitted Documents',

    }

    // Group by intern
    const grouped = {};

      if (!grouped[d.internId]) grouped[d.internId] = { name: d.internName, dept: d.dept || 'General', docs: [] };

    const slCls = { pending:'ds-pending', approved:'ds-approved', rejected:'ds-rejected' };
    const slLbl = { pending:'⏳ Pending',  approved:'✅ Approved',  rejected:'✗ Rejected'  };

      const body = document.createElement('div');

      group.docs.forEach(doc => {

        const icons = {
          'TOR': '🎓', 'Certificate of Completion': '🏅',
          'Endorsement Letter': '📨', 'Final Report': '📋',
          'Waiver / MOA': '📝', 'Medical Certificate': '🩺', 'Other': '📎',

        iconEl.className   = 'doc-row-icon';
        iconEl.textContent = icons[doc.type] || '📎';

        const info = document.createElement('div');
        const docDownloadpath =`https://palegoldenrod-raven-703625.hostingersite.com/view-document.php?file=${encodeURIComponent(doc.file_path)}`;
        info.className = 'doc-row-info';
        info.innerHTML = `

            <a href="config/uploads/${docDownloadpath}" target="_blank" style="color:#EA580C;text-decoration:none;font-size:.74rem;font-weight:600">📄 ${doc.file}</a>
            <span style="margin:0 .35rem;opacity:.4">·</span>
            Submitted ${doc.submitted}
            ${doc.feedback ? `<span style="margin:0 .35rem;opacity:.4">·</span><span style="color:#6366F1">💬 Has feedback</span>` : ''}
          </div>`;

        const badge = document.createElement('span');
        badge.className   = 'cui-badge ' + (slCls[doc.status] || 'ds-pending');
        badge.textContent = slLbl[doc.status] || doc.status;

        const actions = document.createElement('div');
        actions.className = 'doc-row-actions';

        // 👁 Inline View Action -> Now utilizes Microsoft Viewer
        actions.appendChild(Helpers.ghostBtn('👁 View', () => {
          // Point directly to your live website proxy file instead of a static folder asset path
          const hostingerFileUrl = `https://palegoldenrod-raven-703625.hostingersite.com/view-document.php?file=${encodeURIComponent(doc.file_path)}`;
          console.log('Generated Hostinger URL for document preview:', hostingerFileUrl);
          // Pass your secure proxy link over into the Microsoft Office Online Viewer
          const previewUrl = `https://view.officeapps.live.com/op/view.aspx?src=${encodeURIComponent(hostingerFileUrl)}`;

        body.appendChild(row);
      });

      const internHeader = document.createElement('div');
      internHeader.style.cssText = 'display:flex;align-items:center;gap:.65rem;margin-bottom:.6rem';
      internHeader.append(Helpers.internAvatar(group.name), (() => {
        const d = document.createElement('div');
        d.innerHTML = `
          <div style="font-family:Sora,sans-serif;font-weight:700;font-size:.9rem;color:#1A0A00">${group.name}</div>
          <div style="font-size:.74rem;color:#9A6647">${group.dept}</div>`;

  _openReviewModal(doc) {

  _quickAction(doc, status) {

    Helpers.api('reviewInternDocument', {
      docId: doc.id,
      status: status,
      feedback: doc.feedback || ''
    }).then(res => {
      if (res.success) {
        doc.status = status;
        this.build(); // Rebuild metrics counters synchronously
        UI.toast(status === 'approved' ? `✅ Approved.` : `Document rejected.`, status === 'approved' ? 'success' : 'danger');

        UI.toast(res.message || 'Operation failed.', 'danger');
      }
    }).catch(err => {

      UI.toast('Server connection profile execution timeout error.', 'danger');
    });
