<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CITAS Internship</title>
  <link rel="icon" href="assets/logo.jpg" type="image/jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/uiParts.css">
  <style>
    body { font-family: 'DM Sans', sans-serif; background: #FFF7ED; margin: 0; }
    .cui-card-title, .cui-page-title { font-family: 'Sora', sans-serif; }

    /* Documents page */
    .doc-type-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 1rem;
      margin-bottom: 1.5rem;
    }
    .doc-type-card {
      background: #fff; border: 1px solid #FED7AA; border-radius: 14px;
      padding: 1.25rem; cursor: pointer;
      transition: box-shadow .15s, border-color .15s, transform .15s;
      display: flex; flex-direction: column; gap: .45rem;
      position: relative; overflow: hidden;
    }
    .doc-type-card:hover { box-shadow: 0 6px 20px rgba(234,88,12,.14); border-color: #EA580C; transform: translateY(-2px); }
    .doc-type-card.submitted { border-color: #10B981; background: #F0FDF4; }
    .doc-type-card.submitted::after {
      content: '✓'; position: absolute; top: .7rem; right: .9rem;
      font-size: .75rem; font-weight: 800; color: #10B981;
      background: #D1FAE5; border-radius: 50%; width: 20px; height: 20px;
      display: flex; align-items: center; justify-content: center;
    }
    .doc-type-card.rejected { border-color: #EF4444; background: #FFF5F5; }
    .doc-type-icon { font-size: 1.85rem; line-height: 1; }
    .doc-type-name { font-family: Sora,sans-serif; font-weight: 700; color: #1A0A00; font-size: .875rem; }
    .doc-type-desc { font-size: .74rem; color: #9A6647; line-height: 1.5; }
    .doc-type-required {
      font-size: .67rem; font-weight: 700; color: #EA580C;
      text-transform: uppercase; letter-spacing: .04em;
      display: inline-flex; align-items: center; gap: .2rem;
    }

    .doc-submission-row {
      background: #fff; border: 1px solid #FED7AA; border-radius: 12px;
      padding: 1rem 1.25rem; margin-bottom: .6rem;
      display: flex; align-items: center; gap: 1rem; flex-wrap: wrap;
      transition: box-shadow .15s;
    }
    .doc-submission-row:hover { box-shadow: 0 4px 12px rgba(234,88,12,.08); }
    .doc-sub-icon  { font-size: 1.4rem; flex-shrink: 0; }
    .doc-sub-info  { flex: 1; min-width: 150px; }
    .doc-sub-name  { font-family: Sora,sans-serif; font-weight: 700; color: #1A0A00; font-size: .875rem; }
    .doc-sub-meta  { font-size: .74rem; color: #9A6647; margin-top: .15rem; }
    .doc-sub-actions { display: flex; gap: .4rem; flex-shrink: 0; }
    .ds-pending  { background: #FEF3C7; color: #92400E; }
    .ds-approved { background: #D1FAE5; color: #065F46; }
    .ds-rejected { background: #FEE2E2; color: #991B1B; }
  </style>
  <script>
    window.onerror = function (msg, url, line, col, error) {
    const el = document.getElementById("error-log");
    el.textContent += `Error: ${msg} at ${line}:${col}\n`;
    };
  </script>
</head>
<body>
  <p id="error-log" style="color:red; font-size:12px;"></p>

  </div>
</div>

<script src="assets/uiParts.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script>

/**
 * @typedef {Object} Company
 * @property {number|null} id
 * @property {string|null} name
 * @property {string|null} address
 * @property {string|null} phone
 * @property {string|null} email
 * @property {string|null} created_at
 */

/**
 * @typedef {Object} Internship
 * @property {number} id
 * @property {string} position
 * @property {string} supervisor
 * @property {number} supervisor_phone
 * @property {string} start_date
 * @property {string} end_date
 * @property {string} status
 * @property {string} created_at
 * @property {number} total_hours
 * @property {number} days_present
 * @property {number} reports_submitted
 * @property {Company|null} company
 */

/**
 * @typedef {Object} InternData
 * @property {{id:number,name:string,email:string}} user
 * @property {{course:string,year_level:string,phone:string,required_hours:number,joined_date:string,coordinator_id:number}|null} profile
 * @property {Internship[]} internships
 */

/** @type {InternData|null} */
let InternData;

// ─────────────────────────────────────────────────────────────
//  DATA  — all loaded from API at boot, no hardcoded values
// ─────────────────────────────────────────────────────────────
let ANNOUNCEMENTS  = [];   // from getAnnouncements
let ATTENDANCE_LOG = [];   // from getAttendanceLogs
let REPORTS_DATA   = [];   // from getInternReports


// ─────────────────────────────────────────────────────────────
//  STATE
// ─────────────────────────────────────────────────────────────
let clockState  = 'none'; // 'none' | 'in' | 'done'
let timeInStamp = null;


// ─────────────────────────────────────────────────────────────
//  NAVIGATION
// ─────────────────────────────────────────────────────────────
const SECTIONS = {
  dashboard:  'Dashboard',
  profile:    'Profile',
  attendance: 'Attendance',
  reports:    'Weekly Reports',
  documents:  'Documents',
};
// ─────────────────────────────────────────────────────────────
//  SHARED HELPERS
//  Utility functions used by multiple sections
// ─────────────────────────────────────────────────────────────
const Helpers = {

  // Page header row with optional action button
  pageHeader(title, subtitle = '', action = null) {
    const wrap = document.createElement('div');
    wrap.className = 'cui-page-header';
    const left = document.createElement('div');
    left.innerHTML = `
      <div class="cui-page-title">${title}</div>
      ${subtitle ? `<div class="cui-page-subtitle">${subtitle}</div>` : ''}`;
    wrap.appendChild(left);
    if (action) wrap.appendChild(action);
    return wrap;
  },

  // Single announcement item — handles both API format (is_pinned, created_at)
  // and legacy format (pinned, date, author)
  annItem(ann) {
    const pinned = ann.pinned || parseInt(ann.is_pinned);
    const date   = ann.date
      || (ann.created_at
          ? new Date(ann.created_at).toLocaleDateString('en-US', { month:'short', day:'numeric', year:'numeric' })
          : '');
    const author = ann.author || 'Coordinator';

    const wrap = document.createElement('div');
    wrap.className = 'cui-announcement' + (pinned ? ' pinned' : '');
    wrap.innerHTML = `
      ${pinned ? '<span class="cui-announcement-pin">📌 Pinned</span>' : ''}
      <div class="cui-announcement-title">${ann.title}</div>
      <div class="cui-announcement-body">${ann.body}</div>
      <div class="cui-announcement-meta">By ${author} · ${date}</div>`;
    return wrap;
  },

  // Sidebar footer with avatar + name/role
  sidebarFooter(name, role) {
    const wrap = document.createElement('div');
    wrap.style.cssText = 'display:flex;align-items:center;gap:.65rem';
    const av = UI.avatar(name, 'sm');
    av.style.cssText = 'background:rgba(255,255,255,.22);border:1.5px solid rgba(255,255,255,.35)';
    const info = document.createElement('div');
    info.style.minWidth = '0';
    info.innerHTML = `
      <div style="font-size:.85rem;font-weight:700;color:#fff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${name}</div>
      <div style="font-size:.72rem;color:rgba(255,255,255,.6)">${role}</div>`;
    wrap.append(av, info);
    return wrap;
  },

  // Refresh a card container with a new element
  refreshCard(containerId, buildFn) {
    const el = document.getElementById(containerId);
    if (!el) return;
    el.innerHTML = '';
    el.appendChild(buildFn());
  },
  async api(action, extra = {}) {
    const res  = await fetch('config/api.php', {
      method:  'POST',
      headers: { 'Content-Type': 'application/json' },
      body:    JSON.stringify({ action, ...extra }),
    });
    return res.json();
  },
};
let sidebar;
let topbar;
function buildNavBar () {
  sidebar = UI.pageSidebar({
    brand:     'Intern Portal',    // role-specific label
    brandIcon: '🎒',
    items: [
      { section:true, label:'Menu' },
      { label:'Dashboard',      icon:'📋', active:true,  onClick: () => navigate('dashboard')  },
      { label:'Profile',        icon:'👤',               onClick: () => navigate('profile')    },
      { label:'Attendance',     icon:'🕐',               onClick: () => navigate('attendance') },
      { label:'Weekly Reports', icon:'📄',
        badge: REPORTS_DATA.filter(r => r.status === 'revision').length || null,
        onClick: () => navigate('reports') },
      { label:'Documents',      icon:'🗃️',
        onClick: () => navigate('documents') },
      { section:true, label:'Account' },
      { label:'Sign Out', icon:'🚪',
        onClick: () => { 
          if (confirm('Sign out of CITAS?')) {
            fetch('config/api.php', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ action: 'logout' }),
            }).then(res => {
              location.href = '/'; 
            })
          }
        } 
      },
    ],
    footer: Helpers.sidebarFooter(InternData.user?.name, InternData.internships[0]?.position),
  });

  topbar = UI.navbar({
    brand:     'CITAS Internship',            // system brand on navbar
    brandIcon: '🎓',
    sidebar,
    pageTitle: 'Dashboard',
    right: [
      UI.badge('Intern', { base:'#FFF7ED', text:'#EA580C', border:'#FED7AA' }),
      (() => {
        const av = UI.avatar(InternData.user?.name, 'sm');
        av.style.background = 'linear-gradient(135deg,#FF6B00,#EA580C)';
        return av;
      })(),
    ],
  });
  document.getElementById('page-main').prepend(topbar.el);

}


function navigate(name) {
  document.querySelectorAll('.cui-section').forEach(s => s.classList.remove('active'));
  document.getElementById('sec-' + name).classList.add('active');
  sidebar.setActive(SECTIONS[name]);
  const center = document.querySelector('.cui-navbar-center');
  if (center) center.textContent = SECTIONS[name];
  Helpers.api('', {
    action: 'setCurrentPage',
    page: name
  });
}




// ─────────────────────────────────────────────────────────────
//  DASHBOARD
// ─────────────────────────────────────────────────────────────
const Dashboard = {

  get internship() {
    return InternData.internships?.[0] ?? null;
  },

  get company() {
    return this.internship?.company ?? null;
  },

  build() {
    const sec = document.getElementById('sec-dashboard');
    const hour = new Date().getHours();

    const greeting =
      hour < 12 ? 'Good morning' :
      hour < 17 ? 'Good afternoon' :
      'Good evening';

    sec.appendChild(
      Helpers.pageHeader(
        `${greeting}, ${InternData.user.name.split(' ')[0]}! 👋`,
        new Date().toLocaleDateString('en-US', {
          weekday: 'long',
          year: 'numeric',
          month: 'long',
          day: 'numeric'
        })
      )
    );

    sec.appendChild(this.statStrip());
    sec.appendChild(this.progressBar());

    const row1 = document.createElement('div');
    row1.className = 'pg-grid-2 mt-lg';
    row1.appendChild(this.announcementsCard());
    row1.appendChild(this.progressInsightsCard());
    sec.appendChild(row1);

    const row2 = document.createElement('div');
    row2.className = 'pg-grid-2 mt-lg';
    row2.appendChild(this.profilePreviewCard());
    row2.appendChild(this.recentAttendanceCard());
    sec.appendChild(row2);

    setTimeout(() => this.drawHoursTrendChart(), 50);
  },

  statStrip() {
    const internship = this.internship;
    const required = InternData.profile.required_hours;

    const total = internship?.total_hours ?? 0;
    const days = internship?.days_present ?? 0;
    const reports = internship?.reports_submitted ?? 0;

    const pct = required ? Math.round((total / required) * 100) : 0;

    return UI.statRow([
      { value: `${total}h`, label: 'Hours Rendered', color: '#EA580C' },
      { value: days, label: 'Days Present', color: '#10B981' },
      { value: reports, label: 'Reports Submitted', color: '#6366F1' },
      { value: `${pct}%`, label: 'Completion', color: '#EA580C' }
    ]);
  },

  progressBar() {
    const internship = this.internship;
    const required = InternData.profile.required_hours;

    const total = internship?.total_hours ?? 0;
    const remaining = Math.max(0, required - total);
    const pct = required ? Math.round((total / required) * 100) : 0;

    const wrap = document.createElement('div');
    wrap.style.marginBottom = '1rem';

    wrap.appendChild(
      UI.progress(pct, {
        color: { base: '#EA580C' },
        label: true
      })
    );

    const sub = document.createElement('p');
    sub.style.cssText = 'font-size:.75rem;color:#9A6647;margin-top:.35rem';

    sub.textContent =
      `${total}h of ${required}h required · ${remaining}h remaining`;

    wrap.appendChild(sub);

    return wrap;
  },


  announcementsCard() {
    const body = document.createElement('div');

    if (!ANNOUNCEMENTS.length) {
      body.appendChild(UI.empty('📭', 'No announcements', 'Check back later.'));
    } else {
      [...ANNOUNCEMENTS]
        .sort((a, b) => (parseInt(b.is_pinned)||b.pinned||0) - (parseInt(a.is_pinned)||a.pinned||0))
        .forEach(a => body.appendChild(Helpers.annItem(a)));
    }

    const pinned = ANNOUNCEMENTS.filter(a => parseInt(a.is_pinned) || a.pinned).length;
    return UI.card({
      title: '📢 Announcements',
      headerActions: pinned ? UI.badge(pinned + ' pinned', 'warning') : null,
      body,
    });
  },

progressInsightsCard() {
    // Reference the primary internship object directly from InternData
    const internship = InternData.internships[0];
    
    const pct        = Math.round(internship.total_hours / InternData.profile.required_hours * 100);
    const remaining  = InternData.profile.required_hours - internship.total_hours;
    const daysIn     = internship.days_present;
    const avgPerDay  = daysIn > 0 ? (internship.total_hours / daysIn) : 8;
    const daysNeeded = Math.ceil(remaining / avgPerDay);

    // Projected finish date from today
    const projDate = new Date();
    let workDaysAdded = 0;
    while (workDaysAdded < daysNeeded) {
      projDate.setDate(projDate.getDate() + 1);
      const day = projDate.getDay();
      if (day !== 0 && day !== 6) workDaysAdded++; // skip weekends
    }
    const projStr = projDate.toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });

    // Dynamic expected weekly reports calculation based on duration weeks
    const startDate = new Date(internship.start_date);
    const endDate   = new Date(internship.end_date);
    const totalWeeks = Math.max(1, Math.round((endDate - startDate) / (1000 * 60 * 60 * 24 * 7)));

    // Dynamic pace metric evaluation
    const expectedPct = this.getExpectedPercentage();
    const onPace      = pct >= expectedPct;

    const body = document.createElement('div');

    // On-pace badge
    const paceBadge = document.createElement('div');
    paceBadge.style.cssText = `display:inline-flex;align-items:center;gap:.4rem;padding:.4rem .9rem;border-radius:20px;font-size:.82rem;font-weight:700;margin-bottom:1rem;background:${onPace ? '#D1FAE5' : '#FEE2E2'};color:${onPace ? '#065F46' : '#991B1B'}`;
    paceBadge.innerHTML = onPace
      ? '✅ You are on schedule'
      : `⚠️ ${expectedPct - pct}% behind the expected pace`;
    body.appendChild(paceBadge);

    // Key insights matrix rows
    [
      ['📅', 'Projected finish',    projStr],
      ['⚡', 'Avg hours / day',     avgPerDay.toFixed(1) + 'h'],
      ['📆', 'Work days remaining', daysNeeded + ' days at current pace'],
      ['📄', 'Reports submitted',   `${internship.reports_submitted} of ~${totalWeeks} expected`],
    ].forEach(([icon, label, value]) => {
      const row = document.createElement('div');
      row.style.cssText = 'display:flex;align-items:flex-start;gap:.5rem;padding:.45rem 0;border-bottom:1px solid #FFF0E0;font-size:.82rem';
      row.innerHTML = `
        <span style="opacity:.55;flex-shrink:0;margin-top:.1rem">${icon}</span>
        <span style="color:#9A6647;min-width:130px;flex-shrink:0">${label}</span>
        <span style="font-weight:600;color:#1A0A00">${value}</span>`;
      body.appendChild(row);
    });

    // Mini hours trend chart mounting point
    const chartLabel = document.createElement('p');
    chartLabel.style.cssText = 'font-size:.75rem;font-weight:700;color:#9A6647;text-transform:uppercase;letter-spacing:.05em;margin:1rem 0 .4rem';
    chartLabel.textContent   = 'Your Daily Hours (Last 6 Days)';
    body.appendChild(chartLabel);

    const canvas = document.createElement('canvas');
    canvas.id     = 'chart-intern-trend';
    canvas.height = 80;
    body.appendChild(canvas);

    return UI.card({ title: '📈 My Progress Insights', body });
  },

  getExpectedPercentage() {
    const internship = InternData.internships[0];
    const currentDate = new Date();
    const startDate   = new Date(internship.start_date);
    const endDate     = new Date(internship.end_date);
    
    const totalDuration   = (endDate - startDate) / (1000 * 60 * 60 * 24); // in days
    const elapsedDuration = (currentDate - startDate) / (1000 * 60 * 60 * 24); // in days
    
    // Bounds check protection to isolate layout context against anomalies
    const rawPercentage = Math.round((elapsedDuration / totalDuration) * 100);
    return Math.max(0, Math.min(100, rawPercentage));
  },
    // Mini sparkline — uses attendance logs loaded from API at boot
  drawHoursTrendChart() {
    const ctx = document.getElementById('chart-intern-trend');
    if (!ctx || typeof Chart === 'undefined') return;

    // Take last 6 completed days (have time_out), oldest first
    const recent = ATTENDANCE_LOG
      .filter(l => l.total_hours != null)
      .slice(0, 6)
      .reverse();

    if (!recent.length) return; // nothing to chart yet

    const labels = recent.map(l =>
      new Date(l.log_date + 'T00:00:00')
        .toLocaleDateString('en-US', { month:'short', day:'numeric' })
    );
    const hours = recent.map(l => parseFloat(l.total_hours));

    // Auto-scale Y axis based on actual data
    const minH = Math.max(0, Math.floor(Math.min(...hours)) - 1);
    const maxH = Math.ceil(Math.max(...hours)) + 1;

    new Chart(ctx, {
      type: 'line',
      data: {
        labels,
        datasets: [{
          data:                hours,
          borderColor:         '#EA580C',
          backgroundColor:     'rgba(234,88,12,.1)',
          pointBackgroundColor:'#EA580C',
          pointRadius:         3,
          pointHoverRadius:    5,
          tension:             0.3,
          fill:                true,
        }],
      },
      options: {
        responsive: true,
        plugins: { legend: { display:false }, tooltip: {
          callbacks: { label: ctx => ` ${ctx.parsed.y}h` },
        }},
        scales: {
          y: {
            min: minH, max: maxH,
            ticks: { callback: v => v+'h', font:{ size:10 } },
            grid:  { color: '#FFF0E0' },
          },
          x: { grid: { display:false }, ticks: { font:{ size:9 }, maxRotation:30 } },
        },
      },
    });
  },

  profilePreviewCard() {
    const body = document.createElement('div');
    [
      ['🏢', this.company.name],
      ['📍', this.company.address.split(',').slice(-2).join(',').trim()],
      ['👤', 'Supervisor: ' + this.internship.supervisor],
      ['📅', this.internship.start_date + ' → ' + this.internship.end_date],
    ].forEach(([icon, text]) => {
      const row = document.createElement('div');
      row.style.cssText = 'display:flex;gap:.5rem;align-items:flex-start;padding:.45rem 0;border-bottom:1px solid #FFF0E0;font-size:.82rem;color:#6B3A1F';
      row.innerHTML = `<span style="opacity:.55;flex-shrink:0">${icon}</span><span>${text}</span>`;
      body.appendChild(row);
    });

    const btn = UI.button('View Full Profile →', {
      block: true,
      color: { base:'#FFF7ED', hover:'#FFEDD5', text:'#EA580C', border:'#FED7AA' },
      onClick: () => navigate('profile'),
    });
    btn.style.marginTop = '.85rem';
    body.appendChild(btn);

    return UI.card({ title: '🏢 My Internship', body });
  },

  recentAttendanceCard() {
    // Map API format { log_date, time_in, time_out, total_hours }
    // to display format { date, timeIn, timeOut, hours }
    const fmt = dt => dt
      ? new Date(dt).toLocaleTimeString('en-US', { hour:'2-digit', minute:'2-digit' })
      : '—';

    const rows = ATTENDANCE_LOG.slice(0, 4).map(l => ({
      date:    new Date(l.log_date + 'T00:00:00').toLocaleDateString('en-US', { month:'short', day:'numeric', year:'numeric' }),
      timeIn:  fmt(l.time_in),
      timeOut: l.time_out ? fmt(l.time_out) : '—',
      hours:   l.total_hours != null ? parseFloat(l.total_hours).toFixed(2) : '—',
    }));

    const emptyBody = UI.empty('📭', 'No attendance yet', 'Use Time In on the Attendance page.');

    return UI.card({
      title: '🕐 Recent Attendance',
      padding: rows.length ? false : true,
      headerActions: UI.button('View all', {
        variant: 'ghost', size: 'sm',
        color: { base:'#FFF7ED', hover:'#FFEDD5', text:'#EA580C', border:'#FED7AA' },
        onClick: () => navigate('attendance'),
      }),
      body: rows.length
        ? UI.table([
            { key:'date',    label:'Date',  render: v => `<strong>${v}</strong>` },
            { key:'timeIn',  label:'In'   },
            { key:'timeOut', label:'Out'  },
            { key:'hours',   label:'Hrs', align:'center',
              render: v => v !== '—'
                ? `<span style="color:#EA580C;font-weight:700">${v}h</span>`
                : '<span style="color:#9A6647">—</span>' },
          ], rows, { hoverable: true })
        : emptyBody,
    });
  },
};
// ─────────────────────────────────────────────────────────────
//  PROFILE
// ─────────────────────────────────────────────────────────────
const Profile = {

  build() {
    const sec = document.getElementById('sec-profile');
    sec.appendChild(Helpers.pageHeader('My Profile', 'Personal and internship information'));

    const grid = document.createElement('div');
    grid.className = 'pg-grid-2';
    grid.style.alignItems = 'start';
    grid.appendChild(this.leftColumn());
    grid.appendChild(this.rightColumn());
    sec.appendChild(grid);
  },

  // 🔹 Helper to safely get internship
  get internship() {
    return InternData.internships?.[0] || {};
  },

  get company() {
    return this.internship.company || {};
  },

  // 🔹 Helper to convert YYYY-MM-DD to "Month Day, Year"
  formatReadableDate(dateString) {
    if (!dateString) return '—';
    const date = new Date(dateString);
    if (isNaN(date.getTime())) return dateString; // Fallback if already formatted or invalid
    return date.toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });
  },

  leftColumn() {
    const col = document.createElement('div');
    col.style.cssText = 'display:flex;flex-direction:column;gap:1.1rem';
    col.appendChild(this.personalCard());
    col.appendChild(this.detailsCard());
    col.appendChild(this.editButton());
    return col;
  },

  rightColumn() {
    const col = document.createElement('div');
    col.style.cssText = 'display:flex;flex-direction:column;gap:1.1rem';
    col.appendChild(this.companyCard());
    col.appendChild(this.hoursCard());
    return col;
  },

  personalCard() {
    return UI.profileCard({
      name: InternData.user.name,
      role: `${InternData.profile.course} · ${InternData.profile.year_level}`,
      email: InternData.user.email,
      dept: InternData.profile.course,
      yearLevel: InternData.profile.year_level,
      joined: this.formatReadableDate(InternData.profile.joined_date),
    });
  },

  detailsCard() {
    const body = document.createElement('div');
    [
      ['📱', 'Phone', InternData.profile.phone],
      ['📚', 'Course', InternData.profile.course],
      ['🎓', 'Year Level', InternData.profile.year_level],
      ['📅', 'Joined', this.formatReadableDate(InternData.profile.joined_date)],
    ].forEach(([i, l, v]) => body.appendChild(UI.infoRow(i, l, v || '—')));

    return UI.card({ title: '📋 Personal Details', body });
  },

  editButton() {
    return UI.button('✏️ Edit Profile', {
      block: true,
      color: { base:'#FFF7ED', hover:'#FFEDD5', text:'#EA580C', border:'#FED7AA' },
      onClick: () => this.openEditModal(),
    });
  },

  companyCard() {
    return UI.companyInfoCard({
      company:    this.company.name || 'Not assigned',
      position:   this.internship.position || '—',
      address:    this.company.address || '—',
      supervisor: this.internship.supervisor || '—',
      phone:      this.company.phone || '—',
      email:      this.company.email || '—',
      startDate:  this.formatReadableDate(this.internship.start_date),
      endDate:    this.formatReadableDate(this.internship.end_date),
    });
  },

  hoursCard() {
    const total = this.internship.total_hours || 0;
    const required = InternData.profile.required_hours || 1;

    const pct = Math.round((total / required) * 100);

    const body = document.createElement('div');

    body.appendChild(UI.statRow([
      { value: total + 'h', label: 'Rendered', color: '#EA580C' },
      { value: (required - total) + 'h', label: 'Remaining', color: '#6B3A1F' },
      { value: pct + '%', label: 'Complete', color: '#10B981' },
    ]));

    const lbl = document.createElement('p');
    lbl.style.cssText = 'font-size:.78rem;color:#9A6647;margin:.7rem 0 .4rem';
    lbl.textContent = `Progress toward ${required}h requirement`;

    body.appendChild(lbl);
    body.appendChild(UI.progress(pct, { color: { base: '#EA580C' }, label: true }));
    return UI.card({ title: '⏳ Hours Summary', body });
  },

  openEditModal() {
    if (this.editModal) {
      this.populateEditModal();
      this.editModal.open();
      return;
    }

    const body = document.createElement('div');

    const section = label => {
      const d = document.createElement('div');
      d.className = 'cui-form-section';
      d.textContent = label;
      body.appendChild(d);
    };

    const twoCol = () => {
      const d = document.createElement('div');
      d.className = 'cui-form-row';
      body.appendChild(d);
      return d;
    };

    /* ---------------- PERSONAL INFORMATION ---------------- */

    section('Personal Information');

    this.nameField = UI.input({
      id: 'nameField',
      placeholder: 'Full name'
    });

    this.phoneField = UI.input({
      id: 'phoneField',
      placeholder: '+63 9xx xxx xxxx'
    });

    this.courseField = UI.input({
      id: 'courseField',
      type: 'select',
      options: ['BSIT', 'BSCS', 'BSBA']
    });

    this.yearLevelField = UI.input({
      id: 'yearLevelField',
      type: 'select',
      options: [
        '1st Year',
        '2nd Year',
        '3rd Year',
        '4th Year',
        'Irregular'
      ]
    });

    body.appendChild(UI.formGroup('Full Name', this.nameField));
    body.appendChild(UI.formGroup('Phone', this.phoneField));

    const r1 = twoCol();
    r1.appendChild(UI.formGroup('Course', this.courseField));
    r1.appendChild(UI.formGroup('Year Level', this.yearLevelField));

    /* ---------------- INTERNSHIP / COMPANY ---------------- */

    section('Internship / Company');

    this.companyNameField = UI.input({
      id: 'companyNameField',
      placeholder: 'Company name'
    });

    this.positionField = UI.input({
      id: 'positionField',
      placeholder: 'e.g. IT Intern'
    });

    this.addressField = UI.textarea({
      id: 'addressField',
      rows: 2,
      placeholder: 'Full address'
    });

    this.supervisorField = UI.input({
      id: 'supervisorField',
      placeholder: 'Supervisor name'
    });

    this.companyPhoneNumber = UI.input({
      id: 'companyPhoneNumber',
      placeholder: 'Phone Number'
    });
    this.companyEmail = UI.input({
      id: 'companyEmail',
      placeholder: 'Email Address'
    });
    this.startDateField = UI.input({
      id: 'startDateField',
      type: 'date'
    });

    this.endDateField = UI.input({
      id: 'endDateField',
      type: 'date'
    });

    body.appendChild(UI.formGroup('Company Name', this.companyNameField));
    body.appendChild(UI.formGroup('Department', this.positionField));
    body.appendChild(UI.formGroup('Address', this.addressField));
    body.appendChild(UI.formGroup('Supervisor', this.supervisorField));
    body.appendChild(UI.formGroup('Phone Number', this.companyPhoneNumber));
    body.appendChild(UI.formGroup('Company Email', this.companyEmail));

    const r2 = twoCol();
    r2.appendChild(UI.formGroup('Start Date', this.startDateField));
    r2.appendChild(UI.formGroup('End Date', this.endDateField));

    // Automatically calculate suggested end date when start date is added or changed
    this.startDateField.addEventListener('change', () => {
      if (!this.startDateField.value) return;

      const requiredHours = InternData.profile?.required_hours || 500;
      const hoursPerDay = 8; 
      const workDaysNeeded = Math.ceil(requiredHours / hoursPerDay);

      const calculatedDate = new Date(this.startDateField.value);
      let workDaysAdded = 0;

      while (workDaysAdded < workDaysNeeded) {
        calculatedDate.setDate(calculatedDate.getDate() + 1);
        const dayOfWeek = calculatedDate.getDay();
        if (dayOfWeek !== 0 && dayOfWeek !== 6) {
          workDaysAdded++;
        }
      }

      const yyyy = calculatedDate.getFullYear();
      const mm = String(calculatedDate.getMonth() + 1).padStart(2, '0');
      const dd = String(calculatedDate.getDate()).padStart(2, '0');

      this.endDateField.value = `${yyyy}-${mm}-${dd}`;
    });

    /* ---------------- MODAL ---------------- */

    this.editModal = UI.modal({
      title: '✏️ Edit Profile',
      body,
      size: 'lg',
      footer: [
        UI.button('Cancel', {
          variant: 'ghost',
          size: 'sm',
          onClick: () => this.editModal.close()
        }),
        UI.button('Save Changes', {
          size: 'sm',
          color: {
            base: '#EA580C',
            hover: '#C2410C',
            text: '#fff'
          },
          onClick: () => this.saveProfileChanges(this.editModal)
        })
      ]
    });

    this.populateEditModal();
    this.editModal.open();
  },

  populateEditModal() {
    // Keeps raw YYYY-MM-DD input field binding compliant
    this.nameField.value = InternData.user?.name || '';
    this.phoneField.value = InternData.profile?.phone || '';
    this.courseField.value = InternData.profile?.course || '';
    this.yearLevelField.value = InternData.profile?.year_level || '';

    this.companyNameField.value = this.company?.name || '';
    this.positionField.value = this.internship?.position || '';
    this.addressField.value = this.company?.address || '';
    this.supervisorField.value = this.internship?.supervisor || '';
    this.companyPhoneNumber.value = this.internship?.supervisor_phone || '';
    this.companyEmail.value = this.company?.email || '';
    this.startDateField.value = this.internship?.start_date || '';
    this.endDateField.value = this.internship?.end_date || '';
  },

  async saveProfileChanges(modal) {
    const payload = {
      action: 'updateInternProfile',

      user: {
        name: document.getElementById('nameField').value.trim(),
      },

      profile: {
        phone: document.getElementById('phoneField').value.trim(),
        course: document.getElementById('courseField').value,
        year_level: document.getElementById('yearLevelField').value,
      },

      internship: {
        company_name: document.getElementById('companyNameField').value.trim(),
        position: document.getElementById('positionField').value.trim(),
        address: document.getElementById('addressField').value.trim(),
        supervisor: document.getElementById('supervisorField').value.trim(),
        supervisor_phone: document.getElementById('companyPhoneNumber').value.trim(),
        start_date: document.getElementById('startDateField').value || null,
        end_date: document.getElementById('endDateField').value || null,
      },
      company: {
        email: document.getElementById('companyEmail').value.trim(),
       }
    };
    console.log('Payload to be sent for profile update:', JSON.stringify(payload, null, 2)); // Debug log  
    try {
      const response = await fetch('config/api.php', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify(payload)
      });

      if (!response.ok) {
        throw new Error(`HTTP ${response.status}`);
      }

      const result = await response.json();

      if (!result.success) {
        throw new Error(result.message || 'Failed to update profile.');
      }

      // Update local data
      this.applyProfileUpdates(result);
      Dashboard.profilePreviewCard();
      
      // Re-render UI
      const sec = document.getElementById('sec-profile');
      sec.innerHTML = '';
      this.build();

      UI.toast(result.message, 'success');
      modal.close();

    } catch (error) {
      console.error(error);
      UI.toast(error.message, 'error');
    }
  },

  applyProfileUpdates(response) {
    if (!response) return;

    if (response.user) {
      Object.assign(InternData.user, response.user);
    }

    if (response.profile) {
      Object.assign(InternData.profile, response.profile);
    }

    if (response.internship) {
      if (!InternData.internships?.length) {
        InternData.internships = [{
          company: {}
        }];
      }

      const internship = InternData.internships[0];

      Object.assign(internship, {
        position: response.internship.position,
        supervisor: response.internship.supervisor,
        supervisor_phone: response.internship.supervisor_phone,
        start_date: response.internship.start_date,
        end_date: response.internship.end_date
      });

      if (response.internship.company) {
        internship.company ??= {};
        Object.assign(internship.company, response.internship.company);
      }
    }
  }  
};// ─────────────────────────────────────────────────────────────
//  ATTENDANCE
// ─────────────────────────────────────────────────────────────
const Attendance = {

  // Cached logs (synced from ATTENDANCE_LOG global at boot)
  logs: [],

  build() {
    const sec = document.getElementById('sec-attendance');
    sec.appendChild(Helpers.pageHeader('Attendance', 'Track your daily time in and out'));

    const grid = document.createElement('div');
    grid.className = 'pg-grid-2';
    grid.style.alignItems = 'start';
    grid.appendChild(this.clockCard());

    // Slot so hours card can be refreshed after clock actions
    const hoursSlot = document.createElement('div');
    hoursSlot.id = 'att-hours-slot';
    hoursSlot.appendChild(this.hoursCard());
    grid.appendChild(hoursSlot);
    sec.appendChild(grid);

    // Slot so log table can be refreshed after clock actions / edits
    const logSlot = document.createElement('div');
    logSlot.id = 'att-log-slot';
    sec.appendChild(logSlot);

    this.startClock();
    this.init();  // restore clock state + render log from pre-loaded data
  },

  // Restore clock state from today's log, render table from pre-loaded data
  async init() {
    // Sync local cache with globally pre-loaded attendance logs
    this.logs = [...ATTENDANCE_LOG];
    this.renderLogCard();

    // Only need to fetch today's specific log to restore clock state
    try {
      const todayRes = await this.callApi('getTodayLog');
      if (todayRes && todayRes.time_in) {
        timeInStamp      = new Date(todayRes.time_in);
        clockState       = todayRes.time_out ? 'done' : 'in';
        this._todayLogId = todayRes.id;
        if (clockState === 'done') {
          const summary = document.getElementById('clock-summary');
          if (summary) {
            summary.style.display = 'block';
            summary.innerHTML = this.summaryHtml(todayRes.time_in, todayRes.time_out, todayRes.total_hours);
          }
        }
      } else {
        clockState  = 'none';
        timeInStamp = null;
      }
    } catch (e) {
      console.error('Attendance.init:', e);
      clockState  = 'none';
      timeInStamp = null;
    }
    this.renderClockState();
  },

  // Generic API call helper
  async callApi(action, extra = {}) {
    const res = await fetch('config/api.php', {
      method:  'POST',
      headers: { 'Content-Type': 'application/json' },
      body:    JSON.stringify({ action, ...extra }),
    });
    return res.json();
  },

  // Live clock + time in/out buttons
  clockCard() {
    const body = document.createElement('div');
    body.className = 'cui-clock';
    body.innerHTML = `
      <div class="cui-clock-time" id="clock-display">--:--:--</div>
      <div class="cui-clock-date" id="clock-date-display"></div>
      <div id="clock-status-wrap" style="margin-top:.75rem"></div>
      <div class="cui-clock-actions" id="clock-btn-wrap"></div>
      <div id="clock-summary"
        style="display:none;padding:.75rem 0 0;text-align:center;font-size:.85rem;color:#9A6647"></div>
    `;
    return UI.card({ title: '🕐 Time Tracker', body });
  },

  // Big hours number + stat strip + progress bar
  hoursCard() {
    const totalHours = InternData.internships[0].total_hours
    const requiredHours = InternData.profile.required_hours
    const daysPresent = InternData.internships[0].days_present;
    const pct  = Math.round(totalHours / requiredHours * 100);
    const body = document.createElement('div');

    const big = document.createElement('div');
    big.style.cssText = 'text-align:center;padding:1rem 0';
    big.innerHTML = `
      <div style="font-family:Sora,sans-serif;font-size:2.5rem;font-weight:800;color:#EA580C;line-height:1">
        ${totalHours}h
      </div>
      <div style="font-size:.8rem;color:#9A6647;margin-top:.3rem">of ${requiredHours}h required</div>`;
    body.appendChild(big);

    body.appendChild(UI.statRow([
      { value: daysPresent,                           label: 'Days Present', color: '#EA580C' },
      { value: (requiredHours - totalHours) + 'h', label: 'Hours Left',   color: '#6B3A1F' },
      { value: pct + '%',                            label: 'Complete',     color: '#10B981' },
    ]));

    const lbl = document.createElement('p');
    lbl.style.cssText = 'font-size:.78rem;color:#9A6647;margin:.8rem 0 .4rem';
    lbl.textContent   = 'Progress toward completion';
    body.appendChild(lbl);
    body.appendChild(UI.progress(pct, { color: { base: '#EA580C' }, label: true }));

    return UI.card({ title: '📊 My Hours', body });
  },

  // Render log table into the att-log-slot div
  renderLogCard() {
    const slot = document.getElementById('att-log-slot');
    if (!slot) return;
    slot.innerHTML = '';

    if (!this.logs.length) {
      slot.appendChild(UI.card({
        title: '📋 Attendance Log',
        body:  UI.empty('📭', 'No logs yet', 'Records appear here after your first Time In.'),
      }));
      return;
    }

    const fmtTime = dt => dt
      ? new Date(dt).toLocaleTimeString('en-US', { hour:'2-digit', minute:'2-digit' })
      : '—';
    const fmtDate = d =>
      new Date(d + 'T00:00:00').toLocaleDateString('en-US', { month:'short', day:'numeric', year:'numeric' });

    const tbl = UI.table([
      { key:'log_date',    label:'Date',
        render: v => `<strong>${fmtDate(v)}</strong>` },
      { key:'time_in',     label:'Time In',  render: v => fmtTime(v) },
      { key:'time_out',    label:'Time Out',
        render: v => v ? fmtTime(v) : UI.badge('In Progress', { base:'#D1FAE5', text:'#065F46' }) },
      { key:'total_hours', label:'Hours', align:'center',
        render: v => v != null
          ? `<span style="color:#EA580C;font-weight:700">${parseFloat(v).toFixed(2)}h</span>`
          : '<span style="color:#9A6647">—</span>' },
      { key:'notes', label:'Notes',
        render: v => `<span style="font-size:.78rem;color:#9A6647">${v || '—'}</span>` },
      { key:'id', label:'', align:'center',
        render: (_, row) => UI.button('✏️ Edit', {
          variant: 'ghost', size: 'sm',
          color: { base:'#FFF7ED', hover:'#FFEDD5', text:'#EA580C', border:'#FED7AA' },
          onClick: () => Attendance.openEditModal(row),
        })},
    ], this.logs, { hoverable: true });

    slot.appendChild(UI.card({
      title:   `📋 Attendance Log (${this.logs.length} day${this.logs.length !== 1 ? 's' : ''})`,
      padding: false,
      body:    tbl,
    }));
  },

  // Tick every second
  startClock() {
    const tick = () => {
      const n   = new Date();
      const dEl = document.getElementById('clock-display');
      const dtEl= document.getElementById('clock-date-display');
      if (dEl)  dEl.textContent  = n.toLocaleTimeString('en-US', { hour:'2-digit', minute:'2-digit', second:'2-digit' });
      if (dtEl) dtEl.textContent = n.toLocaleDateString('en-US', { weekday:'long', month:'long', day:'numeric', year:'numeric' });
    };
    tick();
    setInterval(tick, 1000);
  },

  // Rebuild status badge + buttons based on current clockState
  renderClockState() {
    const statusWrap = document.getElementById('clock-status-wrap');
    const btnWrap    = document.getElementById('clock-btn-wrap');
    if (!statusWrap) return;
    statusWrap.innerHTML = '';
    btnWrap.innerHTML    = '';

    // Status badge
    const badge = document.createElement('div');
    badge.className = 'cui-clock-status ' + {
      none: 'cui-clock-status-idle',
      in:   'cui-clock-status-in',
      done: 'cui-clock-status-idle',
    }[clockState];
    badge.innerHTML = {
      none: '<span style="opacity:.5">⭕</span> Not yet timed in today',
      in:   `<span style="color:#10B981">●</span> Timed in at ${timeInStamp?.toLocaleTimeString('en-US', { hour:'2-digit', minute:'2-digit' })}`,
      done: '✅ Completed for today',
    }[clockState];
    statusWrap.appendChild(badge);

    // Time In button
    btnWrap.appendChild(UI.button('⏱ Time In', {
      variant: 'success', size: 'lg',
      disabled: clockState !== 'none',
      onClick: async () => {
        const allBtns = btnWrap.querySelectorAll('button');
        allBtns.forEach(b => b.disabled = true);
        try {
          const res = await Attendance.callApi('timeIn');
          if (!res.success) {
            UI.toast('❌ ' + (res.error ?? 'Failed.'), 'danger');
            allBtns.forEach(b => b.disabled = false);
            return;
          }
          timeInStamp      = new Date(res.time_in);
          clockState       = 'in';
          Attendance._todayLogId = res.log_id;
          Attendance.logs.unshift({
            id: res.log_id,
            coordinator_id: InternData.profile.coordinator_id,
            log_date:    new Date().toISOString().slice(0, 10),
            time_in:     res.time_in,
            time_out:    null,
            total_hours: null,
            notes:       '',
          });
          ATTENDANCE_LOG = [...Attendance.logs];
          Attendance.renderClockState();
          Attendance.renderLogCard();
          UI.toast('⏱ Timed in at ' + timeInStamp.toLocaleTimeString('en-US', { hour:'2-digit', minute:'2-digit' }), 'success');
        } catch(_) {
          UI.toast('❌ Network error.', 'danger');
          allBtns.forEach(b => b.disabled = false);
        }
      },
    }));

    // Time Out button
    btnWrap.appendChild(UI.button('🔴 Time Out', {
      variant: 'danger', size: 'lg',
      disabled: clockState !== 'in',
      onClick: async () => {
        const allBtns = btnWrap.querySelectorAll('button');
        allBtns.forEach(b => b.disabled = true);
        try {
          const res = await Attendance.callApi('timeOut');
          if (!res.success) {
            UI.toast('❌ ' + (res.error ?? 'Failed.'), 'danger');
            allBtns.forEach(b => b.disabled = false);
            return;
          }
          clockState = 'done';
          if (InternData.internships?.[0]) {
            InternData.internships[0].total_hours  = res.total_hours;
            InternData.internships[0].days_present = (parseInt(InternData.internships[0].days_present) || 0) + 1;
          }
          const idx = Attendance.logs.findIndex(l => l.id === Attendance._todayLogId);
          if (idx !== -1) {
            Attendance.logs[idx].time_out    = res.time_out;
            Attendance.logs[idx].total_hours = res.total_hours;
          }
          ATTENDANCE_LOG = [...Attendance.logs];

          const summary = document.getElementById('clock-summary');
          if (summary) {
            summary.style.display = 'block';
            summary.innerHTML = Attendance.summaryHtml(res.time_in, res.time_out, res.total_hours);
          }
          Attendance.renderClockState();
          Attendance.renderLogCard();
          Helpers.refreshCard('att-hours-slot', () => Attendance.hoursCard());
          UI.toast(`✅ Timed out · ${parseFloat(res.total_hours).toFixed(2)}h logged today`, 'success');
        } catch(_) {
          UI.toast('❌ Network error.', 'danger');
          allBtns.forEach(b => b.disabled = false);
        }
      },
    }));
  },

  // ── Edit time log modal ───────────────────────────────────
  openEditModal(log) {
    const body = document.createElement('div');

    // Date label (read-only)
    const dateLbl = document.createElement('div');
    dateLbl.style.cssText = 'background:#FFF7ED;border:1px solid #FED7AA;border-radius:10px;padding:.7rem 1rem;font-weight:700;color:#1A0A00;margin-bottom:1.1rem;font-size:.9rem';
    dateLbl.textContent   = '📅 ' + new Date(log.log_date + 'T00:00:00')
      .toLocaleDateString('en-US', { weekday:'long', month:'long', day:'numeric', year:'numeric' });
    body.appendChild(dateLbl);

    // Extract HH:MM from a datetime string (e.g. "2026-04-23 08:02:00" → "08:02")
    const toHHMM = dt => dt ? String(dt).substring(11, 16) : '';

    const timeInInput  = UI.input({ type:'time', id:'att-edit-time-in',  value: toHHMM(log.time_in)  });
    const timeOutInput = UI.input({ type:'time', id:'att-edit-time-out', value: toHHMM(log.time_out) });
    const notesInput   = UI.textarea({
      id:          'att-edit-notes',
      value:       log.notes || '',
      rows:        2,
      placeholder: 'Optional note about this day',
    });

    const row = document.createElement('div');
    row.className = 'cui-form-row';
    row.appendChild(UI.formGroup('Time In',  timeInInput));
    row.appendChild(UI.formGroup('Time Out', timeOutInput, 'Leave blank if still in progress.'));
    body.appendChild(row);
    body.appendChild(UI.formGroup('Notes (optional)', notesInput));

    // Warning if log has no time_out yet (still in progress)
    if (!log.time_out) {
      const warn = document.createElement('div');
      warn.style.cssText = 'margin-top:.75rem;padding:.7rem 1rem;background:#FFFBEB;border:1px solid #FDE68A;border-radius:10px;font-size:.82rem;color:#92400E';
      warn.innerHTML = '⚠️ This log is still <strong>in progress</strong>. Leave Time Out blank to keep it open.';
      body.appendChild(warn);
    }

    const m = UI.modal({
      title: '✏️ Edit Attendance Log',
      body,
      size: 'lg',
      footer: [
        UI.button('Cancel', { variant:'ghost', size:'sm', onClick: () => m.close() }),
        UI.button('Save Changes', {
          size: 'sm',
          color: { base:'#EA580C', hover:'#C2410C', text:'#fff' },
          onClick: () => Attendance.saveEdit(m, log.id),
        }),
      ],
    });
    m.open();
  },

  // ── Save edited log entry ─────────────────────────────────
  async saveEdit(modal, logId) {
    const timeIn  = document.getElementById('att-edit-time-in')?.value;
    const timeOut = document.getElementById('att-edit-time-out')?.value || null;
    const notes   = document.getElementById('att-edit-notes')?.value   || '';

    if (!timeIn) { UI.toast('Time In is required.', 'danger'); return; }

    try {
      const res = await this.callApi('updateTimeLog', {
        log_id:   logId,
        time_in:  timeIn,
        time_out: timeOut,
        notes,
      });

      if (!res.success) {
        UI.toast('❌ ' + (res.error ?? 'Update failed.'), 'danger');
        return;
      }

      // Sync InternData totals so hours card reflects new values
      if (res.internship && InternData.internships?.[0]) {
        InternData.internships[0].total_hours  = res.internship.total_hours;
        InternData.internships[0].days_present = res.internship.days_present;
      }

      // Update local log cache
      const idx = this.logs.findIndex(l => l.id === logId);
      if (idx !== -1) {
        this.logs[idx] = {
          ...this.logs[idx],
          time_in:     res.time_in,
          time_out:    res.time_out,
          total_hours: res.total_hours,
          notes,
        };
      }

      // Keep global ATTENDANCE_LOG in sync so dashboard cards reflect changes
      ATTENDANCE_LOG = [...this.logs];

      // If this was today's log, resync the clock state
      if (logId === this._todayLogId) {
        timeInStamp = new Date(res.time_in);
        clockState  = res.time_out ? 'done' : 'in';
        this.renderClockState();
        if (clockState === 'done') {
          const summary = document.getElementById('clock-summary');
          if (summary) {
            summary.style.display = 'block';
            summary.innerHTML = this.summaryHtml(res.time_in, res.time_out, res.total_hours);
          }
        }
      }

      Helpers.refreshCard('att-hours-slot', () => this.hoursCard());
      this.renderLogCard();
      modal.close();
      UI.toast('✅ Attendance log updated.', 'success');

    } catch (_) {
      UI.toast('❌ Network error. Please try again.', 'danger');
    }
  },

  // ── Format the today-summary line ─────────────────────────
  summaryHtml(timeIn, timeOut, hours) {
    const fmt = dt => new Date(dt).toLocaleTimeString('en-US', { hour:'2-digit', minute:'2-digit' });
    return `
      <strong style="color:#EA580C">${fmt(timeIn)}</strong>
      &nbsp;→&nbsp;
      <strong style="color:#EA580C">${fmt(timeOut)}</strong>
      &nbsp;·&nbsp;<strong>${parseFloat(hours).toFixed(2)}h</strong> rendered`;
  },
};

const Reports = {

  // Holds the loaded reports from the API
  data: [],

  build() {
    const sec = document.getElementById('sec-reports');
    sec.appendChild(Helpers.pageHeader('Weekly Reports', 'Submit and track your internship reports'));

    const grid = document.createElement('div');
    grid.className = 'pg-grid-2';
    grid.style.alignItems = 'start';
    grid.appendChild( this.submitCard() );

    // Right side: placeholder card that gets replaced after data loads
    const tableWrap = document.createElement('div');

    tableWrap.appendChild(UI.card({
      title: '📋 Submitted Reports',
      body:  UI.spinner(),
    }));
    grid.appendChild(tableWrap);

    sec.appendChild(grid);

    this.setDefaultDate();
    this.loadReports();   // fetch real data from API
  },

  // ── Submit card ───────────────────────────────────────────
  submitCard() {
    const body = document.createElement('div');

    // Week label
    body.appendChild(UI.formGroup('Week Label',
      UI.input({ id:'rpt-week', placeholder:'e.g. Week 14 (Apr 21–25)', required: true }),
      '', { required: true }));

    // Week start date
    body.appendChild(UI.formGroup('Week Start Date',
      UI.input({ type:'date', id:'rpt-date', required: true })));

    // Description
    body.appendChild(UI.formGroup('Description (optional)',
      UI.textarea({ id:'rpt-desc',
        placeholder:'What tasks did you accomplish this week?',
        rows: 3 })));

    // Multi-file upload area
    const fileLabel = document.createElement('div');
    fileLabel.className = 'cui-label';
    fileLabel.textContent = 'Report Files (select one or more)';
    body.appendChild(fileLabel);

    // Hidden native file input — supports multiple
    const fileInput = document.createElement('input');
    fileInput.type     = 'file';
    fileInput.id       = 'rpt-files';
    fileInput.name     = 'files[]';
    fileInput.multiple = true;
    fileInput.accept   = '.pdf,.doc,.docx,.png,.jpg,.jpeg';
    fileInput.style.display = 'none';

    // Custom drop zone
    const dropZone = document.createElement('div');
    dropZone.className = 'cui-upload-zone';
    dropZone.style.marginBottom = '.5rem';

    const dropIcon  = document.createElement('div');
    dropIcon.className   = 'cui-upload-icon';
    dropIcon.textContent = '📁';

    const dropLabel = document.createElement('div');
    dropLabel.className   = 'cui-upload-label';
    dropLabel.id          = 'rpt-drop-label';
    dropLabel.innerHTML   = '<strong>Click to browse</strong> or drag & drop';

    const dropHint  = document.createElement('div');
    dropHint.className   = 'cui-upload-hint';
    dropHint.textContent = 'PDF, DOC, DOCX, PNG, JPG — max 10 MB each — multiple files OK';

    dropZone.append(fileInput, dropIcon, dropLabel, dropHint);

    // File list preview (shows chosen file names before submitting)
    const fileList = document.createElement('div');
    fileList.id             = 'rpt-file-list';
    fileList.style.cssText  = 'display:flex;flex-direction:column;gap:.3rem;margin-top:.4rem';

    // Wire up click and drag events
    dropZone.addEventListener('click', () => fileInput.click());
    dropZone.addEventListener('dragover',  e => { e.preventDefault(); dropZone.classList.add('cui-upload-zone-over'); });
    dropZone.addEventListener('dragleave', ()  => dropZone.classList.remove('cui-upload-zone-over'));
    dropZone.addEventListener('drop', e => {
      e.preventDefault();
      dropZone.classList.remove('cui-upload-zone-over');
      fileInput.files = e.dataTransfer.files;
      Reports.updateFileList(fileInput, fileList, dropLabel);
    });
    fileInput.addEventListener('change', () =>
      Reports.updateFileList(fileInput, fileList, dropLabel));

    body.appendChild(dropZone);
    body.appendChild(fileList);

    // Submit button
    body.appendChild(UI.button('📤 Submit Report', {
      block: true, size: 'lg',
      color: { base:'#EA580C', hover:'#C2410C', text:'#fff' },
      onClick: () => Reports.submit(),
    }));

    return UI.card({ title: '📤 Submit New Report', body });
  },

  // Update the visual file list below the drop zone
  updateFileList(input, listEl, labelEl) {
    listEl.innerHTML = '';
    const files = Array.from(input.files);
    if (!files.length) {
      labelEl.innerHTML = '<strong>Click to browse</strong> or drag & drop';
      return;
    }
    labelEl.innerHTML = `<strong>${files.length} file${files.length > 1 ? 's' : ''} selected</strong>`;
    files.forEach(f => {
      const item = document.createElement('div');
      item.style.cssText = 'display:flex;align-items:center;gap:.5rem;font-size:.8rem;color:#6B3A1F;background:#FFF7ED;padding:.35rem .65rem;border-radius:6px;border:1px solid #FED7AA';
      const kb = (f.size / 1024).toFixed(0);
      item.innerHTML = `<span>📄</span><span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${f.name}</span><span style="color:#9A6647;flex-shrink:0">${kb} KB</span>`;
      listEl.appendChild(item);
    });
  },

  // Send the form to upload_report.php via multipart/form-data
  async submit() {
    const weekLabel = document.getElementById('rpt-week')?.value.trim();
    const weekStart = document.getElementById('rpt-date')?.value;
    const desc      = document.getElementById('rpt-desc')?.value.trim();
    const fileInput = document.getElementById('rpt-files');

    if (!weekLabel) { UI.toast('Please enter a week label.', 'danger');  return; }
    if (!weekStart) { UI.toast('Please select a week start date.', 'danger'); return; }
    if (!fileInput?.files?.length) { UI.toast('Please attach at least one file.', 'danger'); return; }

    // Build multipart form data
    const form = new FormData();
    form.append('week_label',  weekLabel);
    form.append('week_start',  weekStart);
    form.append('description', desc);
    Array.from(fileInput.files).forEach(f => form.append('files[]', f));

    // Disable submit button and show loading state
    const btn = document.querySelector('#sec-reports .cui-btn');
    if (btn) { btn.disabled = true; btn.textContent = '⏳ Uploading…'; }

    try {
      const res  = await fetch('config/upload_report.php', { method: 'POST', body: form });
      const json = await res.json();

      if (json.success) {
        UI.toast(`✅ Report submitted — ${json.files.length} file${json.files.length>1?'s':''} uploaded.`, 'success');

        // Reset form
        document.getElementById('rpt-week').value = '';
        document.getElementById('rpt-desc').value = '';
        document.getElementById('rpt-files').value = '';
        document.getElementById('rpt-file-list').innerHTML = '';
        document.getElementById('rpt-drop-label').innerHTML = '<strong>Click to browse</strong> or drag & drop';
        this.setDefaultDate();

        // Refresh the reports table
        this.loadReports();
      } else {
        UI.toast('❌ ' + (json.error ?? 'Upload failed.'), 'danger');
      }
    } catch (err) {
      UI.toast('❌ Network error. Please try again.', 'danger');
    } finally {
      if (btn) { btn.disabled = false; btn.textContent = '📤 Submit Report'; }
    }
  },

  // ── Load reports from API and render the table ─────────────
  async loadReports() {
    try {
      const res  = await fetch('config/api.php', {
        method:  'POST',
        headers: { 'Content-Type': 'application/json' },
        body:    JSON.stringify({ action: 'getInternReports' }),
      });
      this.data = await res.json();
    } catch (_) {
      this.data = [];
    }
    Helpers.refreshCard('reports-table-wrap', () => this.tableCard());
  },

  // ── Reports table card ─────────────────────────────────────
  tableCard() {
    const sl = { pending:'rs-pending', approved:'rs-approved', revision:'rs-revision', reviewed:'rs-reviewed' };
    const tl = { pending:'⏳ Pending', approved:'✅ Approved', revision:'🔁 Revision', reviewed:'👁 Reviewed' };

    if (!this.data.length) {
      return UI.card({
        title: '📋 Submitted Reports',
        body:  UI.empty('📭', 'No reports yet', 'Submit your first weekly report above.'),
      });
    }

    const tbl = UI.table([
      { key:'week_label', label:'Week',
        render: v => `<strong>${v}</strong>` },
      { key:'files',      label:'Files',
        render: files => {
          if (!files?.length) return '—';
          const wrap = document.createElement('div');
          wrap.style.cssText = 'display:flex;flex-direction:column;gap:.2rem';
          files.forEach(f => {
            const a = document.createElement('a');
            a.href   = 'uploads/reports/' + f.file_path;
            a.target = '_blank';
            a.style.cssText = 'color:#EA580C;font-size:.78rem;text-decoration:none;display:flex;align-items:center;gap:.25rem';
            a.innerHTML = '📄 ' + f.file_name;
            wrap.appendChild(a);
          });
          return wrap;
        }},
      { key:'status', label:'Status', align:'center',
        render: v => {
          const b = document.createElement('span');
          b.className   = 'cui-badge ' + (sl[v] ?? 'rs-pending');
          b.textContent = tl[v] ?? v;
          return b;
        }},
      { key:'uploaded_at', label:'Submitted',
        render: v => `<span style="font-size:.78rem;color:#9A6647">${new Date(v).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})}</span>` },
    ], this.data, { hoverable: true });

    // Inject feedback rows under reports that have feedback
    const tbody  = tbl.querySelector('tbody');
    let   offset = 0;
    this.data.forEach((r, i) => {
      if (!r.feedback) return;
      const fr = tbody.insertRow(i + 1 + offset++);
      fr.innerHTML = `<td colspan="4" style="background:#FFFBEB;font-size:.8rem;color:#92400E;padding:.5rem 1rem">
        💬 <strong>Feedback:</strong> ${r.feedback}
      </td>`;
    });

    return UI.card({
      title:         '📋 Submitted Reports',
      padding:       false,
      headerActions: UI.badge(this.data.length + ' submitted', 'warning'),
      body:          tbl,
    });
  },

  // Default the week-start field to the most recent Monday
  setDefaultDate() {
    const mon = new Date();
    mon.setDate(mon.getDate() - ((mon.getDay() + 6) % 7));
    const d = document.getElementById('rpt-date');
    if (d) d.value = mon.toISOString().split('T')[0];
  },
};

//  INTERN DOCUMENTS
//  Submit and track end-of-internship required documents
// ─────────────────────────────────────────────────────────────
const InternDocuments = {

  // Document types required for internship completion
  _docTypes: [
    { type:'TOR',                     icon:'🎓', desc:'Transcript of Records from your school registrar.',           required: true  },
    { type:'Certificate of Completion', icon:'🏅', desc:'Certificate issued by your company upon completion.',        required: true  },
    { type:'Endorsement Letter',        icon:'📨', desc:'Official endorsement letter from your school or department.',required: true  },
    { type:'Final Report',              icon:'📋', desc:'Comprehensive report summarizing your internship experience.',required: true  },
    { type:'Waiver / MOA',              icon:'📝', desc:'Signed Memorandum of Agreement or liability waiver.',        required: false },
    { type:'Medical Certificate',       icon:'🩺', desc:'Health clearance certificate (if required by company).',     required: false },
    { type:'Other',                     icon:'📎', desc:'Any additional document requested by your coordinator.',     required: false },
  ],

  // Live state cache array
  _submissions: [],

  build() {
    const sec = document.getElementById('sec-documents');
    sec.innerHTML = '';

    sec.appendChild(Helpers.pageHeader(
      'Documents',
      'Submit required documents for your internship completion',
    ));

    // Async Fetch layer mapping live database contents
    Helpers.api('getInternDocuments').then(data => {
      this._submissions = data || [];
      
      sec.appendChild(this._progressCard());
      sec.appendChild(this._docTypeGrid());
      sec.appendChild(this._submissionsCard());
    }).catch(err => {
      console.error(err);
      UI.toast('Failed to load submitted document statuses.', 'danger');
    });
  },

  // Completion progress card
  _progressCard() {
    const required    = this._docTypes.filter(d => d.required);
    const submittedR  = required.filter(d =>
      this._submissions.some(s => s.type === d.type && s.status !== 'rejected')
    ).length;
    const approved    = this._submissions.filter(s => s.status === 'approved').length;
    const pending     = this._submissions.filter(s => s.status === 'pending').length;
    const rejected    = this._submissions.filter(s => s.status === 'rejected').length;
    const pct         = required.length > 0 ? Math.round(submittedR / required.length * 100) : 0;

    const body = document.createElement('div');

    // Stat row
    body.appendChild(UI.statRow([
      { value: `${submittedR}/${required.length}`, label: 'Required Docs',   color: '#EA580C' },
      { value: approved,                            label: 'Approved',         color: '#10B981' },
      { value: pending,                             label: 'Under Review',     color: '#F59E0B' },
      { value: rejected,                            label: 'Needs Resubmit',   color: '#EF4444' },
    ]));

    // Progress bar
    const lbl = document.createElement('p');
    lbl.style.cssText = 'font-size:.78rem;color:#9A6647;margin:.75rem 0 .4rem';
    lbl.textContent   = `Required document completion: ${pct}%`;
    body.appendChild(lbl);
    body.appendChild(UI.progress(pct, { color: { base: '#EA580C' }, label: true }));

    // Info notice
    if (rejected) {
      const notice = document.createElement('div');
      notice.style.cssText = 'margin-top:1rem;padding:.75rem 1rem;background:#FEE2E2;border:1px solid #FECACA;border-radius:10px;font-size:.82rem;color:#991B1B';
      notice.innerHTML = `⚠️ <strong>${rejected} document${rejected !== 1 ? 's' : ''}</strong> need${rejected === 1 ? 's' : ''} to be resubmitted. Check the feedback below and upload a revised version.`;
      body.appendChild(notice);
    } else if (pct === 100) {
      const notice = document.createElement('div');
      notice.style.cssText = 'margin-top:1rem;padding:.75rem 1rem;background:#D1FAE5;border:1px solid #A7F3D0;border-radius:10px;font-size:.82rem;color:#065F46';
      notice.innerHTML = '🎉 <strong>All required documents submitted!</strong> Your coordinator is reviewing them.';
      body.appendChild(notice);
    }

    return UI.card({ title: '📊 Submission Progress', body });
  },

  // Grid of document type cards — click to open upload modal
  _docTypeGrid() {
    const section = document.createElement('div');
    const label   = document.createElement('div');
    label.style.cssText = 'font-family:Sora,sans-serif;font-size:.85rem;font-weight:700;color:#1A0A00;margin-bottom:.75rem';
    label.textContent   = 'Document Checklist';
    section.appendChild(label);

    const grid = document.createElement('div');
    grid.className = 'doc-type-grid';

    this._docTypes.forEach(dt => {
      const existing = this._submissions.find(s => s.type === dt.type);
      const card     = document.createElement('div');
      card.className = 'doc-type-card' +
        (existing && existing.status !== 'rejected' ? ' submitted' : '') +
        (existing && existing.status === 'rejected'  ? ' rejected'  : '');

      const requiredTag = dt.required
        ? `<span class="doc-type-required">⭐ Required</span>`
        : `<span style="font-size:.67rem;color:#9A6647;font-weight:600;text-transform:uppercase;letter-spacing:.04em">Optional</span>`;

      card.innerHTML = `
        <div class="doc-type-icon">${dt.icon}</div>
        <div class="doc-type-name">${dt.type}</div>
        <div class="doc-type-desc">${dt.desc}</div>
        ${requiredTag}`;

      // Status pill at bottom if submitted
      if (existing) {
        const pill = document.createElement('div');
        const pillMap = { pending:'ds-pending', approved:'ds-approved', rejected:'ds-rejected' };
        const pillLbl = { pending:'⏳ Under Review', approved:'✅ Approved', rejected:'✗ Rejected' };
        pill.className   = 'cui-badge ' + (pillMap[existing.status] || 'ds-pending');
        pill.style.cssText = 'margin-top:.25rem;align-self:flex-start';
        pill.textContent = pillLbl[existing.status] || existing.status;
        card.appendChild(pill);
      }

      card.addEventListener('click', () => this._openUploadModal(dt, existing));
      grid.appendChild(card);
    });

    section.appendChild(grid);
    return section;
  },

  // Upload / resubmit modal
  _openUploadModal(dt, existing = null) {
    const isResubmit = existing && existing.status === 'rejected';
    const body       = document.createElement('div');

    // Document type info banner
    const banner = document.createElement('div');
    banner.style.cssText = 'display:flex;align-items:center;gap:.85rem;padding:1rem;background:#FFF7ED;border:1px solid #FED7AA;border-radius:12px;margin-bottom:1.25rem';
    banner.innerHTML = `
      <span style="font-size:2rem;flex-shrink:0">${dt.icon}</span>
      <div>
        <div style="font-family:Sora,sans-serif;font-weight:700;color:#1A0A00;font-size:.95rem">${dt.type}</div>
        <div style="font-size:.78rem;color:#9A6647;margin-top:.15rem;line-height:1.5">${dt.desc}</div>
      </div>`;
    body.appendChild(banner);

    // Show coordinator feedback if resubmitting
    if (isResubmit && existing.feedback) {
      const fbBox = document.createElement('div');
      fbBox.style.cssText = 'padding:.85rem 1rem;background:#FEF3C7;border:1px solid #FDE68A;border-radius:10px;font-size:.82rem;color:#92400E;margin-bottom:1.1rem';
      fbBox.innerHTML = `💬 <strong>Coordinator feedback:</strong> ${existing.feedback}`;
      body.appendChild(fbBox);
    }

    // File upload zone
    const fileLabel = document.createElement('div');
    fileLabel.className   = 'cui-label';
    fileLabel.textContent = isResubmit ? 'Upload Revised Document' : 'Attach Document File';
    body.appendChild(fileLabel);

    const fileInput = document.createElement('input');
    fileInput.type    = 'file';
    fileInput.id      = 'doc-upload-file';
    fileInput.accept  = '.pdf,.doc,.docx,.png,.jpg,.jpeg';
    fileInput.style.display = 'none';

    const dropZone = document.createElement('div');
    dropZone.className = 'cui-upload-zone';
    dropZone.style.marginBottom = '.85rem';

    const dropIcon  = document.createElement('div');
    dropIcon.className   = 'cui-upload-icon';
    dropIcon.textContent = '📁';

    const dropLbl = document.createElement('div');
    dropLbl.className = 'cui-upload-label';
    dropLbl.id        = 'doc-drop-label';
    dropLbl.innerHTML = '<strong>Click to browse</strong> or drag & drop';

    const dropHint = document.createElement('div');
    dropHint.className   = 'cui-upload-hint';
    dropHint.textContent = 'PDF, DOC, DOCX, PNG, JPG — max 10 MB';

    dropZone.append(fileInput, dropIcon, dropLbl, dropHint);

    dropZone.addEventListener('click', () => fileInput.click());
    dropZone.addEventListener('dragover',  e => { e.preventDefault(); dropZone.classList.add('cui-upload-zone-over'); });
    dropZone.addEventListener('dragleave', () => dropZone.classList.remove('cui-upload-zone-over'));
    dropZone.addEventListener('drop', e => {
      e.preventDefault();
      dropZone.classList.remove('cui-upload-zone-over');
      fileInput.files = e.dataTransfer.files;
      this._updateDropLabel(fileInput, dropLbl);
    });
    fileInput.addEventListener('change', () => this._updateDropLabel(fileInput, dropLbl));
    body.appendChild(dropZone);

    // Notes field
    body.appendChild(UI.formGroup('Notes (optional)',
      UI.textarea({ id:'doc-upload-notes', placeholder: isResubmit ? 'Describe the changes you made…' : 'Any notes for your coordinator…', rows: 3 })
    ));

    const m = UI.modal({
      title: isResubmit ? `🔄 Resubmit: ${dt.type}` : `📤 Submit: ${dt.type}`,
      body,
      size: 'lg',
      footer: [
        UI.button('Cancel', { variant:'ghost', size:'sm', onClick: () => m.close() }),
        UI.button(isResubmit ? '🔄 Resubmit Document' : '📤 Submit Document', {
          size: 'sm',
          color: { base:'#EA580C', hover:'#C2410C', text:'#fff' },
          // Locate this block inside InternDocuments._openUploadModal click handler:
          onClick: () => {
            if (!fileInput.files?.length) {
              UI.toast('Please attach a file before submitting.', 'danger');
              return;
            }
            
            // Build Form Data Instance
            const formData = new FormData();
            formData.append('action', 'uploadInternDocument');
            formData.append('document_type', dt.type);
            formData.append('notes', document.getElementById('doc-upload-notes')?.value.trim() || '');
            formData.append('doc_file', fileInput.files[0]);

            // Dynamic coordinator assignment pull from your global profile state
            const assignedCoordinatorId = InternData?.profile?.coordinator_id || '';
            formData.append('coordinator_id', assignedCoordinatorId);

            // Send payload to backend router
            fetch('config/api.php', {
              method: 'POST',
              body: formData
            })
            .then(res => res.json())
            .then(res => {
              if (res.success) {
                m.close();
                UI.toast(res.message, 'success');
                this.build(); 
              } else {
                UI.toast(res.message || 'Upload transmission failed.', 'danger');
              }
            })
            .catch(err => {
              console.error(err);
              UI.toast('Connection timeout running multipart sync actions.', 'danger');
            });
          },
        }),
      ],
    });
    m.open();
  },

  _updateDropLabel(input, labelEl) {
    if (!input.files?.length) return;
    labelEl.innerHTML = `<strong>📎 ${input.files[0].name}</strong>`;
    labelEl.style.color = '#EA580C';
  },

  // List of all past submissions
  _submissionsCard() {
    const slCls = { pending:'ds-pending', approved:'ds-approved', rejected:'ds-rejected' };
    const slLbl = { pending:'⏳ Under Review', approved:'✅ Approved', rejected:'✗ Needs Resubmit' };
    const icons  = {
      'TOR':'🎓','Certificate of Completion':'🏅','Endorsement Letter':'📨',
      'Final Report':'📋','Waiver / MOA':'📝','Medical Certificate':'🩺','Other':'📎',
    };

    if (!this._submissions.length) {
      return UI.card({
        title: '📋 My Submissions',
        body:  UI.empty('📭', 'No submissions yet', 'Click a document type above to get started.'),
      });
    }

    const body = document.createElement('div');
    [...this._submissions].sort((a, b) => {
      const order = { rejected:0, pending:1, approved:2 };
      return (order[a.status] ?? 1) - (order[b.status] ?? 1);
    }).forEach(sub => {
      const row = document.createElement('div');
      row.className = 'doc-submission-row';

      const icon = document.createElement('div');
      icon.className   = 'doc-sub-icon';
      icon.textContent = icons[sub.type] || '📎';

      const info = document.createElement('div');
      info.className = 'doc-sub-info';
      info.innerHTML = `
        <div class="doc-sub-name">${sub.type}</div>
        <div class="doc-sub-meta">
          <a href="/uploads/${sub.file_path}" target="_blank" style="color:#EA580C;text-decoration:none;font-size:.74rem">📄 ${sub.file}</a>
          <span style="margin:0 .35rem;opacity:.4">·</span>
          Submitted ${sub.submitted}
          ${sub.feedback ? `<div style="margin-top:.25rem;font-size:.74rem;color:#92400E;background:#FEF3C7;padding:.25rem .5rem;border-radius:6px;display:inline-block">💬 ${sub.feedback}</div>` : ''}
        </div>`;

      const badge = document.createElement('span');
      badge.className   = 'cui-badge ' + (slCls[sub.status] || 'ds-pending');
      badge.textContent = slLbl[sub.status] || sub.status;

      const actions = document.createElement('div');
      actions.className = 'doc-sub-actions';
      if (sub.status === 'rejected') {
        const dt = this._docTypes.find(d => d.type === sub.type) || { type: sub.type, icon:'📎', desc:'', required:false };
        actions.appendChild(UI.button('🔄 Resubmit', {
          size: 'sm',
          color: { base:'#EA580C', hover:'#C2410C', text:'#fff' },
          onClick: () => this._openUploadModal(dt, sub),
        }));
      }

      row.append(icon, info, badge, actions);
      body.appendChild(row);
    });

    return UI.card({
      title: '📋 My Submissions',
      headerActions: UI.badge(this._submissions.length + ' submitted', { base:'#DBEAFE', text:'#1E40AF' }),
      body,
    });
  },
};

// ─────────────────────────────────────────────────────────────
// Generic API helper — used here and by Attendance / Reports
// ─────────────────────────────────────────────────────────────
function apiCall(action, extra = {}) {
  return fetch('config/api.php', {
    method:  'POST',
    headers: { 'Content-Type': 'application/json' },
    body:    JSON.stringify({ action, ...extra }),
  }).then(r => r.json());
}

async function boot() {
  try {
    // Fetch all data in parallel so nothing blocks
    const [internRes, currPageRes, annRes, logsRes, reportsRes] = await Promise.all([
      apiCall('getAllInternData').then (data => {
        if (!data) {
              window.location.href = 'https://palegoldenrod-raven-703625.hostingersite.com'; 
              return
        }
        console.log('Intern data loaded:', JSON.stringify(data, null, 2));
        InternData = data;
        buildNavBar ()

        return data;
      }),
      apiCall('getCurrentPage'),
      apiCall('getAnnouncements'),
      apiCall('getAttendanceLogs'),
      apiCall('getInternReports'),
    ]);

    // Populate global data arrays
    ANNOUNCEMENTS  = Array.isArray(annRes)     ? annRes     : [];
    ATTENDANCE_LOG = Array.isArray(logsRes)    ? logsRes    : [];
    REPORTS_DATA   = Array.isArray(reportsRes) ? reportsRes : [];

    // Build nav first — needs InternData + REPORTS_DATA for badge count
    

    // Build all sections — they read from now-populated globals
    Dashboard .build();
    Profile   .build();
    Attendance.build();
    Reports   .build();
    InternDocuments.build();
    //console.log('Current page:', currPageRes);
    navigate(currPageRes.currentPage || 'dashboard');

  } catch (err) {
    console.error('Boot error:', err);
  }
}

boot();

</script>
